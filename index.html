<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS Roulette — Demo</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #07090e;
    --panel: #10141d;
    --panel2: #151b26;
    --text: #f4f7fb;
    --muted: #7f8a9d;
    --accent: #ff9f1c;
    --blue: #4da6ff;
    --purple: #a855f7;
    --pink: #ec4899;
    --red: #ef4444;
    --gold: #fbbf24;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% -20%, rgba(255,159,28,.12), transparent 40%),
        radial-gradient(circle at 10% 50%, rgba(77,166,255,.08), transparent 35%),
        var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
        linear-gradient(rgba(255,255,255,.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.015) 1px, transparent 1px);
    background-size: 40px 40px;
}

header {
    height: 72px;
    border-bottom: 1px solid rgba(255,255,255,.07);
    background: rgba(8,10,15,.82);
    backdrop-filter: blur(15px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 5%;
    position: sticky;
    top: 0;
    z-index: 50;
}

.logo {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 1px;
}

.logo span {
    color: var(--accent);
}

.nav {
    display: flex;
    gap: 25px;
    color: var(--muted);
    font-size: 14px;
}

.nav a {
    color: inherit;
    text-decoration: none;
    transition: .2s;
}

.nav a:hover {
    color: white;
}

.balance {
    background: #151a23;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 10px;
    padding: 10px 15px;
    font-weight: 800;
}

.balance span {
    color: var(--gold);
}

main {
    width: min(1250px, 94%);
    margin: 35px auto 70px;
}

.hero {
    text-align: center;
    margin-bottom: 30px;
}

.hero h1 {
    margin: 0;
    font-size: clamp(32px, 5vw, 62px);
    text-transform: uppercase;
    letter-spacing: -2px;
}

.hero h1 span {
    color: var(--accent);
}

.hero p {
    color: var(--muted);
    margin-top: 10px;
}

.game {
    background: rgba(16,20,29,.9);
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 25px 80px rgba(0,0,0,.35);
}

.roulette {
    position: relative;
    height: 240px;
    overflow: hidden;
    border-radius: 14px;
    background:
        linear-gradient(90deg, rgba(0,0,0,.9), transparent 12%, transparent 88%, rgba(0,0,0,.9)),
        #0b0f16;
    border: 1px solid rgba(255,255,255,.07);
}

.roulette::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 4px;
    transform: translateX(-50%);
    background: var(--accent);
    box-shadow: 0 0 25px var(--accent);
    z-index: 20;
}

.roulette::before {
    content: "";
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    border-left: 9px solid transparent;
    border-right: 9px solid transparent;
    border-top: 15px solid var(--accent);
    z-index: 25;
}

.track {
    height: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    position: absolute;
    left: 0;
    top: 0;
    will-change: transform;
}

.item {
    width: 175px;
    height: 190px;
    flex: 0 0 175px;
    border-radius: 12px;
    background: linear-gradient(145deg,#171d29,#0e131c);
    border: 1px solid rgba(255,255,255,.07);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 12px;
    overflow: hidden;
    position: relative;
}

.item::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--rarity), transparent 55%);
    opacity: .12;
}

.item img {
    width: 100%;
    height: 125px;
    object-fit: contain;
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 12px 12px rgba(0,0,0,.6));
}

.item-name {
    position: relative;
    z-index: 2;
    font-weight: 800;
    font-size: 13px;
}

.item-rarity {
    position: relative;
    z-index: 2;
    font-size: 10px;
    color: var(--rarity);
    text-transform: uppercase;
    font-weight: bold;
    margin-top: 4px;
}

.rarity-blue { --rarity: #4da6ff; }
.rarity-purple { --rarity: #a855f7; }
.rarity-pink { --rarity: #ec4899; }
.rarity-red { --rarity: #ef4444; }
.rarity-gold { --rarity: #fbbf24; }

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 15px;
    margin-top: 20px;
}

.control {
    background: var(--panel2);
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 12px;
    padding: 14px;
}

.control label {
    display: block;
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 8px;
}

input {
    width: 100%;
    background: #0b0f16;
    border: 1px solid rgba(255,255,255,.08);
    color: white;
    border-radius: 8px;
    padding: 12px;
    outline: none;
}

input:focus {
    border-color: var(--accent);
}

.bet-buttons {
    display: flex;
    gap: 7px;
}

.bet-buttons button {
    flex: 1;
    border: 0;
    background: #202735;
    color: white;
    padding: 10px;
    border-radius: 7px;
    cursor: pointer;
}

.bet-buttons button:hover {
    background: #2c3547;
}

.spin {
    width: 100%;
    border: 0;
    border-radius: 11px;
    padding: 15px;
    margin-top: 18px;
    color: #111;
    font-weight: 900;
    font-size: 16px;
    background: linear-gradient(135deg,#ffb52e,#ff7a00);
    cursor: pointer;
    transition: .2s;
    box-shadow: 0 8px 30px rgba(255,145,0,.2);
}

.spin:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 35px rgba(255,145,0,.35);
}

.spin:disabled {
    opacity: .5;
    cursor: not-allowed;
    transform: none;
}

.result {
    text-align: center;
    min-height: 55px;
    margin-top: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.result strong {
    font-size: 22px;
}

.win {
    animation: win .7s ease infinite alternate;
}

@keyframes win {
    from { transform: scale(1); text-shadow: 0 0 5px var(--gold); }
    to { transform: scale(1.08); text-shadow: 0 0 25px var(--gold); }
}

.section-title {
    margin: 45px 0 15px;
    font-size: 20px;
}

.history {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
}

.history-card {
    background: var(--panel);
    border: 1px solid rgba(255,255,255,.06);
    border-radius: 10px;
    padding: 10px;
    text-align: center;
}

.history-card img {
    width: 100%;
    height: 75px;
    object-fit: contain;
}

.history-card small {
    color: var(--muted);
    display: block;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.stat {
    padding: 18px;
    background: var(--panel);
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.06);
}

.stat small {
    color: var(--muted);
}

.stat b {
    display: block;
    margin-top: 7px;
    font-size: 23px;
}

.toast {
    position: fixed;
    right: 25px;
    bottom: 25px;
    background: #161d29;
    border: 1px solid rgba(255,255,255,.1);
    padding: 16px 20px;
    border-radius: 12px;
    transform: translateY(120px);
    opacity: 0;
    transition: .35s;
    z-index: 100;
}

.toast.show {
    transform: translateY(0);
    opacity: 1;
}

.confetti {
    position: fixed;
    width: 8px;
    height: 14px;
    top: -20px;
    z-index: 90;
    animation: fall 2s linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
    }
}

@media(max-width: 800px) {
    .nav {
        display: none;
    }

    .controls,
    .stats {
        grid-template-columns: 1fr;
    }

    .history {
        grid-template-columns: repeat(3, 1fr);
    }

    .roulette {
        height: 210px;
    }

    .item {
        width: 150px;
        flex-basis: 150px;
        height: 170px;
    }

    .item img {
        height: 105px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">CS<span>ROULETTE</span></div>

    <nav class="nav">
        <a href="#roulette">Рулетка</a>
        <a href="#history">История</a>
        <a href="#stats">Статистика</a>
    </nav>

    <div class="balance">
        Баланс: <span id="balance">1000</span> ₽
    </div>
</header>

<main>

<section class="hero">
    <h1>CS <span>Roulette</span></h1>
    <p>Демо-рулетка со скинами • Только виртуальная валюта</p>
</section>

<section class="game" id="roulette">

    <div class="roulette">
        <div class="track" id="track"></div>
    </div>

    <div class="controls">

        <div class="control">
            <label>Сумма ставки</label>
            <input id="bet" type="number" min="1" value="50">
        </div>

        <div class="control">
            <label>Быстрая ставка</label>
            <div class="bet-buttons">
                <button onclick="setBet(25)">25</button>
                <button onclick="setBet(50)">50</button>
                <button onclick="setBet(100)">100</button>
                <button onclick="setBet(250)">250</button>
            </div>
        </div>

        <div class="control">
            <label>Множитель</label>
            <div style="font-size:25px;font-weight:900;color:#ffb52e">
                x2.0
            </div>
        </div>

    </div>

    <button class="spin" id="spinBtn" onclick="spin()">
        КРУТИТЬ РУЛЕТКУ
    </button>

    <div class="result" id="result">
        Сделай ставку и запускай рулетку
    </div>

</section>

<h2 class="section-title">Статистика</h2>

<section class="stats" id="stats">
    <div class="stat">
        <small>Всего спинов</small>
        <b id="spins">0</b>
    </div>

    <div class="stat">
        <small>Побед</small>
        <b id="wins">0</b>
    </div>

    <div class="stat">
        <small>Потрачено</small>
        <b id="spent">0 ₽</b>
    </div>

    <div class="stat">
        <small>Выиграно</small>
        <b id="won">0 ₽</b>
    </div>
</section>

<h2 class="section-title" id="history">Последние выпадения</h2>

<section class="history" id="historyList"></section>

</main>

<div class="toast" id="toast"></div>

<script>

const skins = [
    {
        name: "Glock-18 | Candy",
        rarity: "blue",
        multiplier: 1.1,
        img: "https://steamcommunity-a.akamaihd.net/economy/image/class/730/730-9CP6G6M1D1"
    },
    {
        name: "AK-47 | Elite",
        rarity: "blue",
        multiplier: 1.2,
        img: "https://steamcommunity-a.akamaihd.net/economy/image/class/730/730-9CP6G6M1D1"
    },
    {
        name: "AWP | Neon",
        rarity: "purple",
        multiplier: 1.6,
        img: "https://steamcommunity-a.akamaihd.net/economy/image/class/730/730-9CP6G6M1D1"
    },
    {
        name: "M4A1-S | Hyper",
        rarity: "purple",
        multiplier: 1.8,
        img: "https://steamcommunity-a.akamaihd.net/economy/image/class/730/730-9CP6G6M1D1"
    },
    {
        name: "AK-47 | Fire",
        rarity: "pink",
        multiplier: 2.3,
        img: "https://steamcommunity-a.akamaihd.net/economy/image/class/730/730-9CP6G6M1D1"
    },
    {
        name: "AWP | Dragon",
        rarity: "red",
        multiplier: 3.5,
        img: "https://steamcommunity-a.akamaihd.net/economy/image/class/730/730-9CP6G6M1D1"
    },
    {
        name: "Karambit | Fade",
        rarity: "gold",
        multiplier: 8,
        img: "https://steamcommunity-a.akamaihd.net/economy/image/class/730/730-9CP6G6M1D1"
    }
];

let balance = 1000;
let spins = 0;
let wins = 0;
let spent = 0;
let won = 0;
let history = [];

const track = document.getElementById("track");
const result = document.getElementById("result");
const spinBtn = document.getElementById("spinBtn");

function randomSkin() {
    const r = Math.random();

    if (r < .42) return skins[0];
    if (r < .65) return skins[1];
    if (r < .82) return skins[2];
    if (r < .91) return skins[3];
    if (r < .97) return skins[4];
    if (r < .995) return skins[5];

    return skins[6];
}

function createItem(skin) {
    const div = document.createElement("div");

    div.className = `item rarity-${skin.rarity}`;

    div.innerHTML = `
        <img src="${skin.img}" alt="">
        <div>
            <div class="item-name">${skin.name}</div>
            <div class="item-rarity">${skin.rarity}</div>
        </div>
    `;

    return div;
}

function fillTrack() {
    track.innerHTML = "";

    for(let i = 0; i < 45; i++) {
        track.appendChild(createItem(randomSkin()));
    }
}

fillTrack();

function setBet(value) {
    document.getElementById("bet").value = value;
}

function sound(type) {
    try {
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.frequency.value = type === "win" ? 700 : 150;
        gain.gain.value = .06;

        osc.start();

        setTimeout(() => {
            osc.stop();
            ctx.close();
        }, 130);
    } catch(e) {}
}

function spin() {

    const bet = Number(document.getElementById("bet").value);

    if (!bet || bet <= 0) {
        showToast("Введите корректную ставку");
        return;
    }

    if (bet > balance) {
        showToast("Недостаточно виртуального баланса");
        return;
    }

    spinBtn.disabled = true;

    balance -= bet;
    spent += bet;
    spins++;

    updateStats();

    const winningSkin = randomSkin();

    fillTrack();

    /*
       Центральная позиция.
       Последний элемент будет выбранным.
    */

    const items = [...track.children];

    const targetIndex = 35;

    items[targetIndex].replaceWith(createItem(winningSkin));

    const itemWidth = 175;
    const gap = 8;
    const center = document.querySelector(".roulette").clientWidth / 2;

    const targetPosition =
        -(targetIndex * (itemWidth + gap))
        + center
        - itemWidth / 2;

    track.style.transition = "none";
    track.style.transform = "translateX(0)";

    requestAnimationFrame(() => {

        requestAnimationFrame(() => {

            track.style.transition =
                "transform 5.2s cubic-bezier(.08,.7,.05,1)";

            track.style.transform =
                `translateX(${targetPosition}px)`;

        });

    });

    setTimeout(() => {

        const payout = Math.floor(bet * winningSkin.multiplier);

        balance += payout;
        won += payout;

        if (payout >= bet) {
            wins++;
        }

        history.unshift({
            ...winningSkin,
            payout
        });

        history = history.slice(0, 6);

        result.innerHTML = `
            <strong class="win">
                ${winningSkin.name}
                — +${payout} ₽
            </strong>
        `;

        result.style.color =
            getRarityColor(winningSkin.rarity);

        addConfetti(winningSkin.rarity === "gold");

        sound(
            winningSkin.rarity === "gold"
            ? "win"
            : "normal"
        );

        renderHistory();
        updateStats();

        spinBtn.disabled = false;

    }, 5400);
}

function getRarityColor(rarity) {

    return {
        blue: "#4da6ff",
        purple: "#a855f7",
        pink: "#ec4899",
        red: "#ef4444",
        gold: "#fbbf24"
    }[rarity];

}

function renderHistory() {

    const container =
        document.getElementById("historyList");

    container.innerHTML = "";

    history.forEach(item => {

        const card =
            document.createElement("div");

        card.className =
            "history-card";

        card.style.borderColor =
            getRarityColor(item.rarity);

        card.innerHTML = `
            <img src="${item.img}">
            <strong>${item.name}</strong>
            <small>${item.rarity}</small>
            <small>+${item.payout} ₽</small>
        `;

        container.appendChild(card);

    });

}

function updateStats() {

    document.getElementById("balance")
        .textContent = balance.toLocaleString("ru-RU");

    document.getElementById("spins")
        .textContent = spins;

    document.getElementById("wins")
        .textContent = wins;

    document.getElementById("spent")
        .textContent = spent.toLocaleString("ru-RU") + " ₽";

    document.getElementById("won")
        .textContent = won.toLocaleString("ru-RU") + " ₽";

}

function showToast(text) {

    const toast =
        document.getElementById("toast");

    toast.textContent = text;

    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    }, 2200);

}

function addConfetti(big) {

    const amount = big ? 100 : 35;

    for(let i = 0; i < amount; i++) {

        const el =
            document.createElement("div");

        el.className = "confetti";

        el.style.left =
            Math.random() * 100 + "vw";

        el.style.animationDelay =
            Math.random() * .7 + "s";

        el.style.background =
            [
                "#ffb52e",
                "#ff4d6d",
                "#4da6ff",
                "#a855f7",
                "#ffffff"
            ][Math.floor(Math.random() * 5)];

        document.body.appendChild(el);

        setTimeout(() => el.remove(), 3000);

    }

}

updateStats();

</script>

</body>
</html>
