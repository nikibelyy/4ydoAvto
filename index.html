<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f2f0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="График смен" />
  <link rel="manifest" href="manifest.json" />
  <title>Календарь смен</title>
  <style>
    :root {
      --bg-color: #f6f2f0;
      --text-main: #2c2c2e;
      --text-muted: #5c5c5e;
      --teal: #3b8c99;
      --red: #e03a2d;
      --pill-bg: #e5e1df;
      --white: #ffffff;
      --spring: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      height: 100%;
      width: 100%;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, sans-serif;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      background: var(--bg-color);
    }

    /* Верхняя шапка с днями недели */
    .weekdays-header {
      padding-top: max(14px, env(safe-area-inset-top));
      padding-bottom: 10px;
      padding-left: 12px;
      padding-right: 12px;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      background: rgba(246, 242, 240, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 10;
      border-bottom: 1px solid rgba(0, 0, 0, 0.04);
    }

    /* Область прокрутки календаря */
    .calendar-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px 32px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .calendar-scroll::-webkit-scrollbar {
      display: none;
    }

    .month-block {
      margin-bottom: 28px;
      transition: transform 0.35s var(--spring), opacity 0.35s ease;
    }

    .month-title {
      text-align: center;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
      margin: 18px 0 16px;
      color: var(--text-main);
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      row-gap: 8px;
      column-gap: 2px;
      justify-items: center;
      align-items: center;
    }

    .day-cell {
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      font-size: 17px;
      font-weight: 400;
      color: var(--text-main);
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.2s var(--spring), color 0.25s ease;
      z-index: 1;
    }

    .day-cell:active {
      transform: scale(0.86);
    }

    /* Бирюзовый круг смены */
    .day-cell::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background-color: var(--teal);
      transform: scale(0.3);
      opacity: 0;
      transition: transform 0.38s var(--spring), opacity 0.25s ease;
      z-index: -2;
    }

    .day-cell.work::before {
      transform: scale(1);
      opacity: 1;
    }

    .day-cell.work {
      color: var(--white);
      font-weight: 500;
    }

    /* Красный внутренний круг (опорная дата / выбранный день) */
    .day-cell::after {
      content: "";
      position: absolute;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background-color: var(--red);
      transform: scale(0);
      opacity: 0;
      transition: transform 0.35s var(--spring), opacity 0.25s ease;
      z-index: -1;
    }

    .day-cell.anchor::after {
      transform: scale(1);
      opacity: 1;
    }

    .day-cell.anchor {
      color: var(--white);
      font-weight: 500;
    }

    /* Нижняя панель управления */
    .bottom-panel {
      background: rgba(246, 242, 240, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
      border-top: 1px solid rgba(0, 0, 0, 0.06);
      z-index: 20;
    }

    /* Переключатель режимов (Segmented Control) */
    .segmented-control {
      position: relative;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--pill-bg);
      border-radius: 999px;
      padding: 4px;
      margin-bottom: 18px;
    }

    .segment-indicator {
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: 4px;
      width: calc((100% - 8px) / 4);
      background: var(--white);
      border-radius: 999px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      transition: transform 0.38s var(--spring);
      z-index: 0;
    }

    .segment-btn {
      position: relative;
      z-index: 1;
      border: none;
      background: none;
      padding: 8px 4px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-main);
      cursor: pointer;
      border-radius: 999px;
      transition: opacity 0.2s ease;
      white-space: nowrap;
    }

    /* Переключатель В месяце / В году */
    .period-toggle-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 14px;
      font-size: 17px;
      color: var(--text-main);
    }

    .switch {
      width: 58px;
      height: 32px;
      background: #d5d1cf;
      border-radius: 999px;
      position: relative;
      cursor: pointer;
      padding: 3px;
      transition: background 0.3s ease;
    }

    .switch-thumb {
      width: 32px;
      height: 26px;
      background: var(--teal);
      border-radius: 999px;
      transition: transform 0.35s var(--spring);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
    }

    .switch.year-mode .switch-thumb {
      transform: translateX(20px);
    }

    /* Счетчики дней */
    .stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
    }

    .stat-box {
      text-align: center;
    }

    .stat-label {
      font-size: 17px;
      color: var(--text-main);
      margin-bottom: 2px;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-main);
      display: inline-block;
      transition: transform 0.25s var(--spring), opacity 0.2s ease;
    }

    .stat-value.bump {
      transform: scale(1.22);
    }

    /* Модальное окно для кнопки "Добавить" */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease;
      z-index: 100;
      padding: 20px;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: var(--bg-color);
      width: 100%;
      max-width: 320px;
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.18);
      transform: scale(0.9) translateY(12px);
      transition: transform 0.35s var(--spring);
    }

    .modal-backdrop.open .modal-card {
      transform: scale(1) translateY(0);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 16px;
    }

    .modal-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-align: center;
    }

    .input-group input {
      width: 100%;
      padding: 10px;
      font-size: 18px;
      text-align: center;
      border: 1px solid #d0ccca;
      border-radius: 12px;
      background: var(--white);
      outline: none;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-cancel {
      background: var(--pill-bg);
      color: var(--text-main);
    }

    .btn-save {
      background: var(--teal);
      color: var(--white);
    }

    @media (max-width: 360px) {
      .day-cell {
        width: 39px;
        height: 39px;
        font-size: 15px;
      }
      .segment-btn {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Шапка дней недели -->
    <header class="weekdays-header">
      <div>пн</div>
      <div>вт</div>
      <div>ср</div>
      <div>чт</div>
      <div>пт</div>
      <div>сб</div>
      <div>вс</div>
    </header>

    <!-- Скролл календаря -->
    <main class="calendar-scroll" id="calendarScroll"></main>

    <!-- Нижняя панель -->
    <footer class="bottom-panel">
      <div class="segmented-control" id="segmentedControl">
        <div class="segment-indicator" id="segmentIndicator"></div>
        <button class="segment-btn" data-index="0" data-work="1" data-rest="3">Один/три</button>
        <button class="segment-btn" data-index="1" data-work="2" data-rest="2">Два/два</button>
        <button class="segment-btn" data-index="2" data-work="3" data-rest="3">Три/три</button>
        <button class="segment-btn" data-index="3" id="customBtn">Добавить</button>
      </div>

      <div class="period-toggle-row">
        <span>В месяце</span>
        <div class="switch" id="periodSwitch" role="switch" aria-checked="false">
          <div class="switch-thumb"></div>
        </div>
        <span>В году</span>
      </div>

      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-label">Рабочих дней</div>
          <div class="stat-value" id="workDaysCount">15</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Выходных дней</div>
          <div class="stat-value" id="restDaysCount">16</div>
        </div>
      </div>
    </footer>
  </div>

  <!-- Модальное окно своего графика -->
  <div class="modal-backdrop" id="customModal">
    <div class="modal-card">
      <div class="modal-title">Свой график смен</div>
      <div class="modal-inputs">
        <div class="input-group">
          <label>Рабочих дней</label>
          <input type="number" id="customWorkInput" min="1" max="30" value="4" />
        </div>
        <div class="input-group">
          <label>Выходных дней</label>
          <input type="number" id="customRestInput" min="1" max="30" value="2" />
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-cancel" id="cancelModal">Отмена</button>
        <button class="btn btn-save" id="saveModal">Применить</button>
      </div>
    </div>
  </div>

  <script>
    const MONTH_NAMES = [
      "Январь", "Февраль", "Март", "Апрель", "Май", "Июнь",
      "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"
    ];

    // Начальное состояние в точности как на скриншоте (2026 год, график 2/2, отметка 5 октября)
    const state = JSON.parse(localStorage.getItem("shift_pwa_state")) || {
      year: 2026,
      workDays: 2,
      restDays: 2,
      segmentIndex: 1,
      // 2 сентября 2026 — первый день смены, чтобы график 2/2 совпал день в день со скриншотом
      cycleStartISO: "2026-09-02",
      anchorDateISO: "2026-10-05",
      isYearStats: false,
      activeMonth: 8 // Сентябрь (0-based)
    };

    const calendarScroll = document.getElementById("calendarScroll");
    const segmentIndicator = document.getElementById("segmentIndicator");
    const segmentedControl = document.getElementById("segmentedControl");
    const periodSwitch = document.getElementById("periodSwitch");
    const workDaysCountEl = document.getElementById("workDaysCount");
    const restDaysCountEl = document.getElementById("restDaysCount");
    const customModal = document.getElementById("customModal");
    const customBtn = document.getElementById("customBtn");

    function saveState() {
      localStorage.setItem("shift_pwa_state", JSON.stringify(state));
    }

    // Разница в днях между двумя датами YYYY-MM-DD (UTC, без сбоев часовых поясов)
    function diffDays(dateISO1, dateISO2) {
      const [y1, m1, d1] = dateISO1.split("-").map(Number);
      const [y2, m2, d2] = dateISO2.split("-").map(Number);
      const utc1 = Date.UTC(y1, m1 - 1, d1);
      const utc2 = Date.UTC(y2, m2 - 1, d2);
      return Math.round((utc1 - utc2) / 86400000);
    }

    function formatISO(year, monthIndex, day) {
      const m = String(monthIndex + 1).padStart(2, "0");
      const d = String(day).padStart(2, "0");
      return `${year}-${m}-${d}`;
    }

    function isWorkDay(dateISO) {
      const cycleLength = state.workDays + state.restDays;
      const diff = diffDays(dateISO, state.cycleStartISO);
      const mod = ((diff % cycleLength) + cycleLength) % cycleLength;
      return mod < state.workDays;
    }

    // Генерация сетки всех 12 месяцев
    function buildCalendar() {
      calendarScroll.innerHTML = "";
      const year = state.year;

      for (let month = 0; month < 12; month++) {
        const monthBlock = document.createElement("section");
        monthBlock.className = "month-block";
        monthBlock.dataset.month = month;

        const title = document.createElement("h2");
        title.className = "month-title";
        title.textContent = MONTH_NAMES[month];
        monthBlock.appendChild(title);

        const grid = document.createElement("div");
        grid.className = "days-grid";

        const firstDayJS = new Date(year, month, 1).getDay();
        const mondayOffset = (firstDayJS + 6) % 7; // Пн = 0 ... Вс = 6
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < mondayOffset; i++) {
          const empty = document.createElement("div");
          grid.appendChild(empty);
        }

        for (let day = 1; day <= daysInMonth; day++) {
          const cell = document.createElement("div");
          cell.className = "day-cell";
          const iso = formatISO(year, month, day);
          cell.dataset.iso = iso;
          cell.textContent = day;

          cell.addEventListener("click", () => {
            state.anchorDateISO = iso;
            state.cycleStartISO = iso;
            saveState();
            updateCalendarHighlights();
            updateStats();
          });

          grid.appendChild(cell);
        }

        monthBlock.appendChild(grid);
        calendarScroll.appendChild(monthBlock);
      }

      setupIntersectionObserver();
      updateCalendarHighlights();
      updateControlsUI();
      updateStats();
    }

    // Обновление классов кружков без пересоздания DOM (для плавной CSS-анимации)
    function updateCalendarHighlights() {
      const cells = calendarScroll.querySelectorAll(".day-cell");
      cells.forEach((cell) => {
        const iso = cell.dataset.iso;
        cell.classList.toggle("work", isWorkDay(iso));
        cell.classList.toggle("anchor", iso === state.anchorDateISO);
      });
    }

    function updateControlsUI() {
      segmentIndicator.style.transform = `translateX(${state.segmentIndex * 100}%)`;
      periodSwitch.classList.toggle("year-mode", state.isYearStats);
      if (state.segmentIndex === 3) {
        customBtn.textContent = `${state.workDays}/${state.restDays}`;
      } else {
        customBtn.textContent = "Добавить";
      }
    }

    function animateCounter(el, newValue) {
      if (el.textContent === String(newValue)) return;
      el.classList.add("bump");
      el.textContent = newValue;
      setTimeout(() => el.classList.remove("bump"), 180);
    }

    function updateStats() {
      let workCount = 0;
      let restCount = 0;
      const year = state.year;

      if (state.isYearStats) {
        for (let m = 0; m < 12; m++) {
          const days = new Date(year, m + 1, 0).getDate();
          for (let d = 1; d <= days; d++) {
            isWorkDay(formatISO(year, m, d)) ? workCount++ : restCount++;
          }
        }
      } else {
        const m = state.activeMonth;
        const days = new Date(year, m + 1, 0).getDate();
        for (let d = 1; d <= days; d++) {
          isWorkDay(formatISO(year, m, d)) ? workCount++ : restCount++;
        }
      }

      animateCounter(workDaysCountEl, workCount);
      animateCounter(restDaysCountEl, restCount);
    }

    // Отслеживание текущего месяца при скролле
    function setupIntersectionObserver() {
      const options = {
        root: calendarScroll,
        threshold: 0.55
      };

      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            state.activeMonth = Number(entry.target.dataset.month);
            if (!state.isYearStats) updateStats();
          }
        });
      }, options);

      document.querySelectorAll(".month-block").forEach((block) => observer.observe(block));
    }

    // Обработчики сегментированного переключателя
    segmentedControl.addEventListener("click", (e) => {
      const btn = e.target.closest(".segment-btn");
      if (!btn) return;

      const idx = Number(btn.dataset.index);
      if (idx === 3) {
        customModal.classList.add("open");
        return;
      }

      state.segmentIndex = idx;
      state.workDays = Number(btn.dataset.work);
      state.restDays = Number(btn.dataset.rest);
      saveState();
      updateControlsUI();
      updateCalendarHighlights();
      updateStats();
    });

    // Переключатель В месяце / В году
    periodSwitch.addEventListener("click", () => {
      state.isYearStats = !state.isYearStats;
      saveState();
      updateControlsUI();
      updateStats();
    });

    // Модальное окно для кнопки "Добавить"
    document.getElementById("cancelModal").addEventListener("click", () => {
      customModal.classList.remove("open");
    });

    document.getElementById("saveModal").addEventListener("click", () => {
      const w = Math.max(1, parseInt(document.getElementById("customWorkInput").value, 10) || 2);
      const r = Math.max(1, parseInt(document.getElementById("customRestInput").value, 10) || 2);
      state.workDays = w;
      state.restDays = r;
      state.segmentIndex = 3;
      saveState();
      customModal.classList.remove("open");
      updateControlsUI();
      updateCalendarHighlights();
      updateStats();
    });

    // Инициализация и прокрутка к Сентябрю (как на фото)
    window.addEventListener("DOMContentLoaded", () => {
      buildCalendar();
      const targetBlock = document.querySelector(`.month-block[data-month="8"]`);
      if (targetBlock) {
        calendarScroll.scrollTop = targetBlock.offsetTop - 75;
      }
    });

    // Регистрация Service Worker для PWA
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
