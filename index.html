<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11131b">
<meta name="description" content="Быстрый современный рабочий календарь. Работает офлайн.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>Tempo — рабочий календарь</title>
<style>

*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 15% -10%,#24293b 0,transparent 38%),var(--bg);color:var(--text);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.app{max-width:1440px;margin:auto;padding:24px clamp(16px,3vw,44px) 48px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:30px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:-.7px;font-size:23px}.logo{width:42px;height:42px;border-radius:14px;background:var(--accent);color:#141a12;display:grid;place-items:center;font-size:22px;box-shadow:0 5px 26px #a8f07822}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:650;margin-top:-3px}.top-actions{display:flex;align-items:center;gap:10px}.pill,.icon-btn,.primary,.view-btn{border:1px solid var(--line);color:var(--text);background:var(--panel);border-radius:13px;padding:10px 14px;transition:transform .18s,background .18s,border-color .18s}.pill:hover,.icon-btn:hover,.view-btn:hover{background:var(--panel2);transform:translateY(-1px)}.primary{background:var(--accent);color:#172013;border-color:transparent;font-weight:750;box-shadow:0 7px 24px #a8f0781a}.primary:hover{transform:translateY(-2px);filter:brightness(1.04)}.icon-btn{width:42px;height:42px;display:grid;place-items:center;padding:0;font-size:18px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:22px;align-items:start}.main-panel,.side-panel{background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:0 20px 80px #00000012}.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:25px 26px 20px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.8px;color:var(--accent);font-weight:800}.month-title{font-size:clamp(25px,3vw,34px);letter-spacing:-1.2px;font-weight:780;margin:5px 0 0}.month-controls{display:flex;align-items:center;gap:8px}.nav-pair{display:flex;gap:5px}.nav-pair .icon-btn{width:37px;height:37px}.view-switch{display:flex;padding:4px;background:#0d0f16;border:1px solid var(--line);border-radius:13px;gap:3px}.view-btn{padding:7px 11px;border:0;background:transparent;color:var(--muted);font-size:13px}.view-btn.active{background:var(--panel2);color:var(--text)}.calendar{padding:0 20px 22px}.weekdays,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekday{text-align:center;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;padding:12px 0}.day{min-height:104px;border:1px solid transparent;background:#191c27;border-radius:13px;padding:9px 8px;position:relative;transition:background .18s,border-color .18s,transform .18s;min-width:0}.day:hover{background:#232838;border-color:#3a4053;transform:translateY(-1px)}.day.outside{background:transparent;color:#5e6476}.day.today{border-color:#a8f07866;background:#1b2520}.day.selected{box-shadow:inset 0 0 0 1px var(--accent);background:#202b23}.day-num{width:27px;height:27px;border-radius:9px;display:grid;place-items:center;font-weight:650;font-size:13px;margin-bottom:7px}.today .day-num{background:var(--accent);color:#172013}.event-chip{font-size:10px;line-height:1.3;padding:4px 5px;border-radius:6px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#b5a2ff22;color:var(--purple);border-left:2px solid var(--purple)}.event-chip.blue{background:#80c8ff20;color:var(--blue);border-color:var(--blue)}.event-chip.green{background:#a8f07820;color:var(--accent);border-color:var(--accent)}.event-chip.pink{background:#ff9fca20;color:var(--pink);border-color:var(--pink)}.event-chip.yellow{background:#ffd47920;color:var(--yellow);border-color:var(--yellow)}.more{font-size:10px;color:var(--muted);padding:3px 4px}.side-panel{padding:22px;position:sticky;top:18px}.side-title{font-size:18px;font-weight:760;letter-spacing:-.4px;margin:4px 0 2px}.side-sub{font-size:12px;color:var(--muted);margin-bottom:20px}.date-badge{display:inline-flex;align-items:center;gap:7px;background:#a8f07818;color:var(--accent);padding:7px 10px;border-radius:10px;font-size:12px;font-weight:700}.agenda-list{display:flex;flex-direction:column;gap:10px}.agenda-item{display:grid;grid-template-columns:48px 3px minmax(0,1fr);gap:10px;align-items:stretch;padding:12px 10px;border:1px solid var(--line);border-radius:14px;background:#191c27;animation:rise .28s ease both}.agenda-time{font-size:11px;color:var(--muted);padding-top:2px}.agenda-bar{border-radius:8px;background:var(--purple)}.agenda-bar.blue{background:var(--blue)}.agenda-bar.green{background:var(--accent)}.agenda-bar.pink{background:var(--pink)}.agenda-bar.yellow{background:var(--yellow)}.agenda-name{font-weight:700;font-size:13px;overflow-wrap:anywhere}.agenda-meta{color:var(--muted);font-size:11px;margin-top:4px}.empty{border:1px dashed #34394a;border-radius:16px;padding:24px 14px;text-align:center;color:var(--muted);font-size:13px}.empty .empty-icon{font-size:26px;margin-bottom:8px}.side-footer{border-top:1px solid var(--line);margin-top:20px;padding-top:17px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px}.week-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.week-col{background:#191c27;border:1px solid var(--line);border-radius:14px;min-height:300px;padding:10px 7px}.week-head{text-align:center;color:var(--muted);font-size:11px;margin-bottom:12px}.week-head strong{display:block;color:var(--text);font-size:20px;margin-top:5px}.week-head .current{color:var(--accent)}.week-event{font-size:10px;padding:7px 6px;border-radius:8px;margin:7px 0;background:#b5a2ff20;color:var(--purple);overflow-wrap:anywhere}.week-event.blue{background:#80c8ff20;color:var(--blue)}.week-event.green{background:#a8f07820;color:var(--accent)}.week-event.pink{background:#ff9fca20;color:var(--pink)}.week-event.yellow{background:#ffd47920;color:var(--yellow)}.modal-backdrop{position:fixed;inset:0;background:#05060bc9;backdrop-filter:blur(9px);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal-backdrop.open{display:flex;animation:fade .18s ease}.modal{width:min(100%,470px);background:#171a25;border:1px solid #34394a;border-radius:24px;padding:25px;box-shadow:0 28px 100px #0008;animation:rise .22s ease}.modal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal h2{margin:0;font-size:23px;letter-spacing:-.7px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted);font-weight:650}.field input,.field select,.field textarea{width:100%;background:#0f1119;border:1px solid #303547;color:var(--text);border-radius:12px;padding:12px;min-width:0}.field textarea{resize:vertical;min-height:70px}.colors{display:flex;gap:10px}.color-choice{width:28px;height:28px;border-radius:50%;border:3px solid transparent;outline:1px solid transparent}.color-choice.active{outline-color:#f4f5fa;outline-offset:3px}.modal-actions{display:flex;gap:10px;justify-content:space-between;margin-top:20px}.modal-actions .primary{flex:1}.delete-btn{border:1px solid #663a48;color:#ff9fca;background:#2a1921;border-radius:12px;padding:10px 13px}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#202635;border:1px solid #3b4357;padding:12px 18px;border-radius:13px;font-size:13px;box-shadow:0 12px 40px #0005;transition:.25s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}.mobile-add{display:none}@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{from{opacity:0}to{opacity:1}}@media(max-width:1000px){.layout{grid-template-columns:minmax(0,1fr) 275px;gap:14px}.calendar-head{padding:22px 18px 16px}.calendar{padding:0 12px 15px}.day{min-height:88px;padding:7px 5px}.event-chip{font-size:9px}.side-panel{padding:18px}}@media(max-width:760px){.app{padding:15px 12px 90px}.topbar{margin-bottom:18px}.brand{font-size:20px}.logo{width:38px;height:38px}.top-actions .pill{display:none}.layout{grid-template-columns:1fr}.main-panel{border-radius:22px}.calendar-head{align-items:flex-start;flex-direction:column;gap:14px;padding:20px 17px 14px}.calendar-head-row{width:100%;display:flex;justify-content:space-between;align-items:center}.month-title{font-size:28px}.month-controls{width:100%;justify-content:space-between}.calendar{padding:0 8px 12px}.weekdays,.days{gap:3px}.weekday{font-size:9px;letter-spacing:0;padding:9px 0}.day{min-height:68px;border-radius:9px;padding:5px 3px}.day-num{width:23px;height:23px;border-radius:7px;font-size:11px;margin-bottom:4px}.event-chip{font-size:0;height:5px;padding:0;border-radius:5px;margin-top:4px;border:0}.more{font-size:9px;padding:2px 0}.side-panel{position:static;border-radius:22px}.side-title{font-size:19px}.week-grid{gap:3px}.week-col{min-height:220px;padding:5px 3px}.week-head{font-size:9px}.week-head strong{font-size:15px}.week-event{font-size:9px;padding:5px 3px}.mobile-add{display:grid;place-items:center;position:fixed;right:18px;bottom:20px;width:58px;height:58px;border:0;border-radius:20px;background:var(--accent);color:#172013;font-size:28px;box-shadow:0 10px 35px #a8f07845;z-index:5}.side-footer{margin-top:15px}}@media(max-width:370px){.view-btn{padding:7px 8px}.nav-pair .icon-btn{width:32px;height:34px}.day{min-height:60px}.calendar-head{padding-left:12px;padding-right:12px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="logo">◷</div><div>tempo<small>your time, in rhythm</small></div></div>
    <div class="top-actions"><button class="pill" id="todayTop">Сегодня</button><button class="icon-btn" id="installBtn" title="Установить приложение" aria-label="Установить приложение" style="display:none">⇩</button><button class="icon-btn" id="addTop" title="Новое событие" aria-label="Новое событие">＋</button></div>
  </header>
  <div class="layout">
    <main class="main-panel">
      <div class="calendar-head">
        <div class="calendar-head-row"><div><div class="eyebrow">Планируй осознанно</div><h1 class="month-title" id="monthTitle">Октябрь 2026</h1></div></div>
        <div class="month-controls">
          <div class="nav-pair"><button class="icon-btn" id="prev" aria-label="Предыдущий период">←</button><button class="icon-btn" id="next" aria-label="Следующий период">→</button></div>
          <div class="view-switch"><button class="view-btn active" data-view="month">Месяц</button><button class="view-btn" data-view="week">Неделя</button></div>
        </div>
      </div>
      <section class="calendar" aria-label="Календарь">
        <div id="calendarContent"></div>
      </section>
    </main>
    <aside class="side-panel">
      <div class="date-badge"><span>✳</span><span id="selectedLabel">СЕГОДНЯ</span></div>
      <h2 class="side-title" id="agendaTitle">План на день</h2>
      <div class="side-sub" id="agendaSubtitle">Твои встречи и задачи в одном месте</div>
      <div class="agenda-list" id="agendaList"></div>
      <div class="side-footer"><span><i class="dot"></i>Всё синхронно с тобой</span><span id="eventCount">0 событий</span></div>
    </aside>
  </div>
</div>
<button class="mobile-add" id="mobileAdd" aria-label="Добавить событие">＋</button>
<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <form class="modal" id="eventForm">
    <div class="modal-top"><h2 id="modalTitle">Новое событие</h2><button class="icon-btn" type="button" id="closeModal" aria-label="Закрыть">×</button></div>
    <div class="field full"><label for="eventName">Название события</label><input id="eventName" name="title" placeholder="Например, планёрка команды" maxlength="90" required autocomplete="off"></div>
    <div class="form-grid">
      <div class="field"><label for="eventDate">Дата</label><input id="eventDate" name="date" type="date" required></div>
      <div class="field"><label for="eventTime">Время</label><input id="eventTime" name="time" type="time" value="10:00" required></div>
      <div class="field"><label for="eventDuration">Длительность</label><select id="eventDuration" name="duration"><option value="15">15 минут</option><option value="30">30 минут</option><option value="45">45 минут</option><option value="60" selected>1 час</option><option value="90">1,5 часа</option><option value="120">2 часа</option></select></div>
      <div class="field"><label for="eventType">Категория</label><select id="eventType" name="color"><option value="purple">Работа</option><option value="blue">Встреча</option><option value="green">Личное</option><option value="pink">Важно</option><option value="yellow">Задача</option></select></div>
      <div class="field full"><label for="eventNote">Заметки (необязательно)</label><textarea id="eventNote" name="note" placeholder="Повестка, ссылка или детали…"></textarea></div>
    </div>
    <div class="modal-actions"><button type="button" class="delete-btn" id="deleteEvent" style="display:none">Удалить</button><button type="submit" class="primary" id="saveEvent">Сохранить событие ↗</button></div>
  </form>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const now = new Date();
  const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const parse = s => {const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
  const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const weekdays = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  const fullDays = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
  const colors = ['purple','blue','green','pink','yellow'];
  let selected = iso(now), cursor = new Date(now.getFullYear(),now.getMonth(),1), view='month', editing=null, deferredInstall=null;
  const starter = [
    {id:'s1',title:'Еженедельная планёрка',date:iso(now),time:'10:00',duration:45,color:'purple',note:'Приоритеты и планы на неделю'},
    {id:'s2',title:'Фокус-сессия',date:iso(now),time:'11:30',duration:90,color:'green',note:'Время для глубокой работы без отвлечений'},
    {id:'s3',title:'Обсуждение проекта',date:iso(now),time:'14:00',duration:60,color:'blue',note:'Статус, вопросы и следующие шаги'},
    {id:'s4',title:'Подготовить отчёт',date:iso(new Date(now.getFullYear(),now.getMonth(),Math.min(now.getDate()+1, new Date(now.getFullYear(),now.getMonth()+1,0).getDate()),12)),time:'09:30',duration:60,color:'yellow',note:''},
    {id:'s5',title:'Дизайн-ревью',date:iso(new Date(now.getFullYear(),now.getMonth(),Math.min(now.getDate()+2, new Date(now.getFullYear(),now.getMonth()+1,0).getDate()),12)),time:'15:00',duration:45,color:'pink',note:'Обратная связь по макетам'}
  ];
  let events = [];
  try {const saved=localStorage.getItem('tempo-events-v1'); events=saved?JSON.parse(saved):starter; if(!Array.isArray(events)) events=starter;} catch {events=starter;}
  const persist=()=>{try{localStorage.setItem('tempo-events-v1',JSON.stringify(events));}catch{}};
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const sortEvents=arr=>arr.slice().sort((a,b)=>a.time.localeCompare(b.time));
  const eventsFor=date=>sortEvents(events.filter(e=>e.date===date));
  const dayStartMonday=d=>(d.getDay()+6)%7;
  const eventChip=e=>`<div class="event-chip ${e.color}" title="${esc(e.title)}">${esc(e.time)} ${esc(e.title)}</div>`;
  function render(){
    $('#monthTitle').textContent=view==='month'?`${monthNames[cursor.getMonth()]} ${cursor.getFullYear()}`:`Неделя · ${monthNames[parse(selected).getMonth()]}`;
    document.querySelectorAll('.view-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
    if(view==='month') renderMonth(); else renderWeek();
    renderAgenda();
  }
  function renderMonth(){
    const first=new Date(cursor.getFullYear(),cursor.getMonth(),1,12), offset=dayStartMonday(first);
    const count=new Date(cursor.getFullYear(),cursor.getMonth()+1,0).getDate();
    const cells=Math.ceil((offset+count)/7)*7;
    let html='<div class="weekdays">'+weekdays.map(d=>`<div class="weekday">${d}</div>`).join('')+'</div><div class="days">';
    for(let i=0;i<cells;i++){
      const day=i-offset+1, date=new Date(cursor.getFullYear(),cursor.getMonth(),day,12), key=iso(date), outside=date.getMonth()!==cursor.getMonth();
      const ev=eventsFor(key), visible=ev.slice(0,2);
      html+=`<button class="day ${outside?'outside':''} ${key===iso(now)?'today':''} ${key===selected?'selected':''}" data-date="${key}" aria-label="${key}, ${ev.length} событий"><span class="day-num">${date.getDate()}</span>${visible.map(eventChip).join('')}${ev.length>2?`<div class="more">+ ещё ${ev.length-2}</div>`:''}</button>`;
    }
    $('#calendarContent').innerHTML=html+'</div>';
    $('#calendarContent').querySelectorAll('.day').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.date;if(parse(selected).getMonth()!==cursor.getMonth())cursor=new Date(parse(selected).getFullYear(),parse(selected).getMonth(),1);render();}));
  }
  function renderWeek(){
    const d=parse(selected); const start=new Date(d);start.setDate(d.getDate()-dayStartMonday(d));
    let html='<div class="week-grid">';
    for(let i=0;i<7;i++){const date=new Date(start);date.setDate(start.getDate()+i);const key=iso(date), ev=eventsFor(key);
      html+=`<button class="week-col" data-date="${key}"><div class="week-head">${weekdays[i]}<strong class="${key===iso(now)?'current':''}">${date.getDate()}</strong></div>${ev.length?ev.map(e=>`<div class="week-event ${e.color}">${esc(e.time)}<br>${esc(e.title)}</div>`).join(''):'<div style="color:#5e6476;text-align:center;font-size:10px;margin-top:24px">—</div>'}</button>`;
    }
    $('#calendarContent').innerHTML=html+'</div>';
    $('#calendarContent').querySelectorAll('.week-col').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.date;renderAgenda();}));
  }
  function renderAgenda(){
    const d=parse(selected), ev=eventsFor(selected);
    $('#selectedLabel').textContent=selected===iso(now)?'СЕГОДНЯ':`${d.getDate()} ${monthNames[d.getMonth()].toLocaleLowerCase()}`;
    $('#agendaTitle').textContent=selected===iso(now)?'План на сегодня':'План на день';
    $('#agendaSubtitle').textContent=`${fullDays[d.getDay()]}, ${d.getDate()} ${monthNames[d.getMonth()].toLocaleLowerCase()}`;
    $('#eventCount').textContent=`${ev.length} ${ev.length===1?'событие':ev.length>1&&ev.length<5?'события':'событий'}`;
    $('#agendaList').innerHTML=ev.length?ev.map((e,i)=>`<div class="agenda-item" style="animation-delay:${i*35}ms"><div class="agenda-time">${esc(e.time)}<br><span style="font-size:10px">${e.duration}м</span></div><div class="agenda-bar ${e.color}"></div><button data-edit="${esc(e.id)}" style="border:0;background:none;color:inherit;text-align:left;padding:0;min-width:0"><div class="agenda-name">${esc(e.title)}</div><div class="agenda-meta">${esc(e.note||'Нажми, чтобы посмотреть детали')}</div></button></div>`).join(''):'<div class="empty"><div class="empty-icon">☼</div><strong style="display:block;color:var(--text);margin-bottom:5px">День свободен</strong>Добавь событие и освободи голову от планов.</div>';
    $('#agendaList').querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>openModal(events.find(e=>e.id===b.dataset.edit))));
  }
  function openModal(event=null){
    editing=event?.id??null; $('#eventForm').reset(); $('#eventDate').value=event?.date??selected; $('#eventTime').value=event?.time??'10:00'; $('#eventName').value=event?.title??''; $('#eventDuration').value=String(event?.duration??60); $('#eventType').value=event?.color??'purple'; $('#eventNote').value=event?.note??'';
    $('#modalTitle').textContent=event?'Редактировать событие':'Новое событие'; $('#saveEvent').textContent=event?'Сохранить изменения ↗':'Сохранить событие ↗'; $('#deleteEvent').style.display=event?'block':'none';
    $('#modalBackdrop').classList.add('open'); setTimeout(()=>$('#eventName').focus(),80);
  }
  function closeModal(){$('#modalBackdrop').classList.remove('open');editing=null;}
  function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2400);}
  $('#eventForm').addEventListener('submit',e=>{
    e.preventDefault();const data={title:$('#eventName').value.trim(),date:$('#eventDate').value,time:$('#eventTime').value,duration:Number($('#eventDuration').value),color:$('#eventType').value,note:$('#eventNote').value.trim()};
    if(!data.title||!data.date)return;
    if(editing){events=events.map(ev=>ev.id===editing?{...ev,...data}:ev);toast('Изменения сохранены');}
    else{events.push({id:crypto.randomUUID?.()??String(Date.now()),...data});toast('Событие добавлено');}
    selected=data.date;cursor=new Date(parse(selected).getFullYear(),parse(selected).getMonth(),1);persist();closeModal();render();
  });
  $('#deleteEvent').addEventListener('click',()=>{if(!editing)return;events=events.filter(e=>e.id!==editing);persist();closeModal();render();toast('Событие удалено');});
  $('#addTop').onclick=$('#mobileAdd').onclick=()=>openModal();
  $('#closeModal').onclick=closeModal;
  $('#modalBackdrop').addEventListener('click',e=>{if(e.target===$('#modalBackdrop'))closeModal()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.metaKey||e.ctrlKey)&&e.key==='n'){e.preventDefault();openModal()}});
  $('#todayTop').onclick=()=>{selected=iso(now);cursor=new Date(now.getFullYear(),now.getMonth(),1);render()};
  $('#prev').onclick=()=>{if(view==='month')cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);else{const d=parse(selected);d.setDate(d.getDate()-7);selected=iso(d);cursor=new Date(d.getFullYear(),d.getMonth(),1)}render()};
  $('#next').onclick=()=>{if(view==='month')cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);else{const d=parse(selected);d.setDate(d.getDate()+7);selected=iso(d);cursor=new Date(d.getFullYear(),d.getMonth(),1)}render()};
  document.querySelectorAll('.view-btn').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;$('#installBtn').style.display='grid'});
  $('#installBtn').onclick=async()=>{if(!deferredInstall)return;deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;$('#installBtn').style.display='none'};
  if('serviceWorker' in navigator && location.protocol.startsWith('http')) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  render();
})();
</script>
</body>
</html>
