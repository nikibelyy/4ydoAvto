<html lang="ru">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#10111d">
<meta name="description" content="Tempo — стеклянный рабочий календарь с локальным хранением и офлайн-доступом.">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>Tempo — Glass Calendar</title>
<style>
:root{color-scheme:dark;--bg:#0d0e19;--glass:rgba(255,255,255,.065);--glass2:rgba(255,255,255,.095);--line:rgba(255,255,255,.12);--text:#f6f5ff;--muted:#a3a4bc;--lime:#c4ff75;--violet:#b9a4ff;--blue:#8bd8ff;--pink:#ffa8d1;--amber:#ffd58a;--shadow:0 24px 80px #0004;--r:24px}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 12% 0%,#5843a33d,transparent 38%),radial-gradient(ellipse at 90% 18%,#1e8b9b22,transparent 34%),radial-gradient(ellipse at 65% 95%,#a34d9b1c,transparent 32%),var(--bg);color:var(--text);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background-attachment:fixed}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--lime);outline-offset:3px}.app{max-width:1480px;margin:auto;padding:26px clamp(14px,3vw,46px) 55px}.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%);box-shadow:var(--shadow)}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px;font-weight:850;font-size:23px;letter-spacing:-.9px}.logo{width:44px;height:44px;display:grid;place-items:center;border-radius:15px;color:#151624;background:linear-gradient(135deg,#d5ff9c,#a3edee);font-size:24px;box-shadow:0 5px 30px #c4ff7530}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:700;margin-top:-2px}.top-actions{display:flex;gap:9px;align-items:center}.btn,.icon-btn,.view-btn{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:10px 14px;transition:transform .2s,background .2s,border-color .2s}.btn:hover,.icon-btn:hover,.view-btn:hover{background:var(--glass2);transform:translateY(-1px)}.primary{background:linear-gradient(130deg,#d5ff9c,#a8efc8);border:0;color:#151724;font-weight:800;box-shadow:0 7px 30px #c4ff7522}.primary:hover{filter:brightness(1.05);transform:translateY(-2px)}.icon-btn{width:42px;height:42px;padding:0;display:grid;place-items:center;font-size:19px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}.panel{border-radius:var(--r);overflow:hidden}.calendar-head{padding:25px 26px 20px;display:flex;justify-content:space-between;align-items:flex-end;gap:18px}.eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--lime);font-weight:850}.month-title{font-size:clamp(27px,3.1vw,37px);letter-spacing:-1.4px;margin:5px 0 0;font-weight:800}.controls{display:flex;align-items:center;gap:10px}.nav-pair{display:flex;gap:6px}.nav-pair .icon-btn{width:37px;height:37px}.switch{display:flex;gap:3px;border:1px solid var(--line);border-radius:14px;background:#090a1490;padding:4px}.view-btn{border:0;background:transparent;padding:7px 12px;color:var(--muted);font-size:12px}.view-btn.active{background:#ffffff15;color:var(--text);box-shadow:inset 0 0 0 1px #ffffff12}.calendar{padding:0 18px 20px}.weekdays,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.weekday{text-align:center;color:var(--muted);font-size:10px;letter-spacing:1.4px;text-transform:uppercase;padding:12px 0}.day{min-width:0;min-height:105px;text-align:left;vertical-align:top;border:1px solid transparent;background:rgba(255,255,255,.035);border-radius:15px;padding:9px 8px;transition:background .2s,border-color .2s,transform .2s}.day:hover{background:rgba(255,255,255,.09);border-color:var(--line);transform:translateY(-2px)}.day.outside{opacity:.38}.day.today{background:#c4ff7510;border-color:#c4ff7555}.day.selected{box-shadow:inset 0 0 0 1px var(--lime);background:#c4ff7515}.day-num{display:grid;place-items:center;width:28px;height:28px;border-radius:10px;font-size:13px;font-weight:700;margin-bottom:7px}.today .day-num{background:var(--lime);color:#151724}.event-chip{font-size:10px;line-height:1.35;padding:4px 5px;border-radius:7px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#b9a4ff20;color:var(--violet);border-left:2px solid var(--violet)}.event-chip.blue{background:#8bd8ff20;color:var(--blue);border-color:var(--blue)}.event-chip.green{background:#c4ff751a;color:var(--lime);border-color:var(--lime)}.event-chip.pink{background:#ffa8d120;color:var(--pink);border-color:var(--pink)}.event-chip.yellow{background:#ffd58a20;color:var(--amber);border-color:var(--amber)}.more{font-size:10px;color:var(--muted);padding:3px 4px}.side{padding:23px;position:sticky;top:18px;border-radius:var(--r)}.date-badge{display:inline-flex;gap:7px;align-items:center;border:1px solid #c4ff7536;background:#c4ff7510;color:var(--lime);padding:7px 11px;border-radius:11px;font-size:11px;font-weight:800}.side-title{font-size:20px;letter-spacing:-.5px;margin:12px 0 3px}.side-sub{color:var(--muted);font-size:12px;margin-bottom:19px}.agenda-list{display:flex;flex-direction:column;gap:10px}.agenda-item{display:grid;grid-template-columns:48px 3px minmax(0,1fr);gap:10px;align-items:stretch;padding:12px 10px;border:1px solid #ffffff10;border-radius:15px;background:#ffffff07;animation:rise .28s ease both}.agenda-time{font-size:11px;color:var(--muted);padding-top:2px}.agenda-time span{font-size:10px}.agenda-bar{border-radius:8px;background:var(--violet)}.agenda-bar.blue{background:var(--blue)}.agenda-bar.green{background:var(--lime)}.agenda-bar.pink{background:var(--pink)}.agenda-bar.yellow{background:var(--amber)}.agenda-open{min-width:0;border:0;background:none;text-align:left;padding:0;color:inherit}.agenda-name{font-size:13px;font-weight:750;overflow-wrap:anywhere}.agenda-meta{font-size:11px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}.empty{border:1px dashed #ffffff28;border-radius:16px;padding:25px 14px;text-align:center;color:var(--muted);font-size:13px}.empty-icon{font-size:28px;margin-bottom:8px}.side-footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:17px;margin-top:20px;color:var(--muted);font-size:11px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--lime);margin-right:6px}.week-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.week-col{border:1px solid #ffffff12;background:#ffffff06;border-radius:15px;min-height:300px;padding:10px 7px;text-align:stretch}.week-head{text-align:center;color:var(--muted);font-size:10px;margin-bottom:12px}.week-head strong{display:block;font-size:20px;color:var(--text);margin-top:5px}.week-head .current{color:var(--lime)}.week-event{font-size:10px;line-height:1.4;padding:7px 6px;border-radius:8px;margin:7px 0;background:#b9a4ff20;color:var(--violet);overflow-wrap:anywhere}.week-event.blue{background:#8bd8ff20;color:var(--blue)}.week-event.green{background:#c4ff751a;color:var(--lime)}.week-event.pink{background:#ffa8d120;color:var(--pink)}.week-event.yellow{background:#ffd58a20;color:var(--amber)}.modal-backdrop{position:fixed;inset:0;z-index:10;background:#060712b8;backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:16px}.modal-backdrop.open{display:flex;animation:fade .18s}.modal{width:min(100%,490px);max-height:min(92vh,800px);overflow:auto;border-radius:26px;padding:25px;background:rgba(26,26,44,.92);border:1px solid #ffffff22;box-shadow:0 30px 100px #0008;animation:rise .23s}.modal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.modal h2{font-size:23px;letter-spacing:-.7px;margin:0}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}.field label{font-size:12px;color:var(--muted);font-weight:650}.field input,.field select,.field textarea{width:100%;min-width:0;background:#111220;border:1px solid #ffffff20;color:var(--text);border-radius:13px;padding:12px}.field textarea{resize:vertical;min-height:75px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}.full{grid-column:1/-1}.modal-actions{display:flex;gap:10px;justify-content:space-between;margin-top:19px}.modal-actions .primary{flex:1}.delete-btn{background:#3a1e31;color:var(--pink);border:1px solid #7d3b64;border-radius:13px;padding:10px 14px}.toast{position:fixed;z-index:20;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:rgba(30,31,51,.94);backdrop-filter:blur(18px);border:1px solid #ffffff20;padding:12px 18px;border-radius:14px;font-size:13px;box-shadow:var(--shadow);transition:.25s;max-width:calc(100vw - 30px);text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.mobile-add{display:none}.privacy-note{color:var(--muted);font-size:10px;margin-top:12px;line-height:1.5}@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{from{opacity:0}to{opacity:1}}@media(max-width:1050px){.layout{grid-template-columns:minmax(0,1fr) 285px;gap:14px}.calendar-head{padding:22px 18px 17px}.calendar{padding:0 11px 14px}.day{min-height:88px;padding:7px 5px}.event-chip{font-size:9px}.side{padding:18px}}@media(max-width:760px){.app{padding:14px 11px 88px}.topbar{margin-bottom:17px}.brand{font-size:20px}.logo{width:39px;height:39px}.top-actions .today-btn{display:none}.layout{grid-template-columns:1fr}.calendar-head{align-items:flex-start;flex-direction:column;gap:14px;padding:20px 15px 14px}.head-row{width:100%;display:flex;align-items:center;justify-content:space-between}.month-title{font-size:28px}.controls{width:100%;justify-content:space-between}.calendar{padding:0 7px 11px}.weekdays,.days{gap:3px}.weekday{font-size:9px;letter-spacing:.4px;padding:8px 0}.day{min-height:66px;padding:5px 3px;border-radius:9px}.day-num{width:23px;height:23px;border-radius:7px;font-size:11px;margin-bottom:4px}.event-chip{height:5px;padding:0;font-size:0;border:0;border-radius:5px;margin-top:4px}.more{font-size:9px;padding:2px 0}.side{position:static;padding:19px}.week-grid{gap:3px}.week-col{min-height:220px;padding:5px 3px}.week-head{font-size:9px}.week-head strong{font-size:15px}.week-event{font-size:9px;padding:5px 3px}.mobile-add{display:grid;place-items:center;position:fixed;right:17px;bottom:18px;width:58px;height:58px;border:0;border-radius:21px;background:linear-gradient(135deg,#d5ff9c,#a8efc8);color:#151724;font-size:28px;box-shadow:0 10px 35px #c4ff7540;z-index:5}.side-footer{margin-top:15px}}@media(max-width:365px){.view-btn{padding:7px 9px}.day{min-height:57px}.calendar-head{padding-left:11px;padding-right:11px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body><div class="app">
<header class="topbar"><div class="brand"><div class="logo">◷</div><div>tempo<small>glass calendar</small></div></div><div class="top-actions"><button class="btn today-btn" id="todayTop">Сегодня</button><button class="icon-btn" id="installBtn" title="Установить приложение" aria-label="Установить приложение" style="display:none">⇩</button><button class="icon-btn" id="addTop" title="Новое событие" aria-label="Новое событие">＋</button></div></header>
<div class="layout"><main class="panel glass"><div class="calendar-head"><div class="head-row"><div><div class="eyebrow">Make space for what matters</div><h1 class="month-title" id="monthTitle">Календарь</h1></div></div><div class="controls"><div class="nav-pair"><button class="icon-btn" id="prev" aria-label="Предыдущий период">←</button><button class="icon-btn" id="next" aria-label="Следующий период">→</button></div><div class="switch"><button class="view-btn active" data-view="month">Месяц</button><button class="view-btn" data-view="week">Неделя</button></div></div></div><section class="calendar" aria-label="Календарь"><div id="calendarContent"></div></section></main>
<aside class="side glass"><div class="date-badge">✳ <span id="selectedLabel">СЕГОДНЯ</span></div><h2 class="side-title" id="agendaTitle">План на сегодня</h2><div class="side-sub" id="agendaSubtitle">Твои встречи и задачи</div><div class="agenda-list" id="agendaList"></div><div class="side-footer"><span><i class="dot"></i>Локально на устройстве</span><span id="eventCount">0 событий</span></div><div class="privacy-note">Твои события не отправляются на сервер. Данные хранятся в этом браузере.</div></aside></div></div>
<button class="mobile-add" id="mobileAdd" aria-label="Добавить событие">＋</button>
<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><form class="modal glass" id="eventForm"><div class="modal-top"><h2 id="modalTitle">Новое событие</h2><button class="icon-btn" type="button" id="closeModal" aria-label="Закрыть">×</button></div><div class="field full"><label for="eventName">Название события</label><input id="eventName" name="title" placeholder="Например, встреча команды" maxlength="90" required autocomplete="off"></div><div class="form-grid"><div class="field"><label for="eventDate">Дата</label><input id="eventDate" name="date" type="date" required></div><div class="field"><label for="eventTime">Время</label><input id="eventTime" name="time" type="time" value="10:00" required></div><div class="field"><label for="eventDuration">Длительность</label><select id="eventDuration" name="duration"><option value="15">15 минут</option><option value="30">30 минут</option><option value="45">45 минут</option><option value="60" selected>1 час</option><option value="90">1,5 часа</option><option value="120">2 часа</option></select></div><div class="field"><label for="eventType">Категория</label><select id="eventType" name="color"><option value="purple">Работа</option><option value="blue">Встреча</option><option value="green">Личное</option><option value="pink">Важно</option><option value="yellow">Задача</option></select></div><div class="field full"><label for="eventNote">Заметки</label><textarea id="eventNote" name="note" placeholder="Повестка, ссылка или детали…"></textarea></div></div><div class="modal-actions"><button type="button" class="delete-btn" id="deleteEvent" style="display:none">Удалить</button><button type="submit" class="btn primary" id="saveEvent">Сохранить событие ↗</button></div></form></div><div class="toast" id="toast" role="status"></div>
<script>
(()=>{const $=s=>document.querySelector(s),now=new Date(),iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)},months=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'],days=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],fullDays=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
let selected=iso(now),cursor=new Date(now.getFullYear(),now.getMonth(),1),view='month',editing=null,deferredInstall=null;
const offset=d=>(d.getDay()+6)%7,escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),sort=a=>a.slice().sort((x,y)=>x.time.localeCompare(y.time)),forDate=d=>sort(events.filter(e=>e.date===d));
const sample=[{id:'demo1',title:'Командная планёрка',date:iso(now),time:'10:00',duration:45,color:'purple',note:'Приоритеты и планы на неделю'},{id:'demo2',title:'Фокус-сессия',date:iso(now),time:'11:30',duration:90,color:'green',note:'Время для глубокой работы'},{id:'demo3',title:'Обсуждение проекта',date:iso(now),time:'14:00',duration:60,color:'blue',note:'Статус и следующие шаги'},{id:'demo4',title:'Подготовить отчёт',date:iso(new Date(now.getFullYear(),now.getMonth(),now.getDate()+1,12)),time:'09:30',duration:60,color:'yellow',note:''},{id:'demo5',title:'Дизайн-ревью',date:iso(new Date(now.getFullYear(),now.getMonth(),now.getDate()+2,12)),time:'15:00',duration:45,color:'pink',note:'Обратная связь по макетам'}];
let events=[];try{const v=localStorage.getItem('tempo-events-v2');events=v?JSON.parse(v):sample;if(!Array.isArray(events))events=sample}catch{events=sample}
function persist(){try{localStorage.setItem('tempo-events-v2',JSON.stringify(events));return true}catch{return false}}
function chip(e){return `<div class="event-chip ${e.color}" title="${escape(e.title)}">${escape(e.time)} ${escape(e.title)}</div>`}
function render(){ $('#monthTitle').textContent=view==='month'?`${months[cursor.getMonth()]} ${cursor.getFullYear()}`:`Неделя · ${months[parse(selected).getMonth()]}`;document.querySelectorAll('.view-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===view));view==='month'?renderMonth():renderWeek();renderAgenda()}
function renderMonth(){const first=new Date(cursor.getFullYear(),cursor.getMonth(),1,12),off=offset(first),count=new Date(cursor.getFullYear(),cursor.getMonth()+1,0).getDate(),total=Math.ceil((off+count)/7)*7;let h='<div class="weekdays">'+days.map(d=>`<div class="weekday">${d}</div>`).join('')+'</div><div class="days">';
for(let i=0;i<total;i++){const date=new Date(cursor.getFullYear(),cursor.getMonth(),i-off+1,12),key=iso(date),outside=date.getMonth()!==cursor.getMonth(),ev=forDate(key);h+=`<button class="day ${outside?'outside':''} ${key===iso(now)?'today':''} ${key===selected?'selected':''}" data-date="${key}" aria-label="${key}, ${ev.length} событий"><span class="day-num">${date.getDate()}</span>${ev.slice(0,2).map(chip).join('')}${ev.length>2?`<div class="more">+ ещё ${ev.length-2}</div>`:''}</button>`}
$('#calendarContent').innerHTML=h+'</div>';$('#calendarContent').querySelectorAll('.day').forEach(b=>b.onclick=()=>{selected=b.dataset.date;if(parse(selected).getMonth()!==cursor.getMonth())cursor=new Date(parse(selected).getFullYear(),parse(selected).getMonth(),1);render()})}
function renderWeek(){const d=parse(selected),start=new Date(d);start.setDate(d.getDate()-offset(d));let h='<div class="week-grid">';for(let i=0;i<7;i++){const date=new Date(start);date.setDate(start.getDate()+i);const key=iso(date),ev=forDate(key);h+=`<button class="week-col" data-date="${key}"><div class="week-head">${days[i]}<strong class="${key===iso(now)?'current':''}">${date.getDate()}</strong></div>${ev.length?ev.map(e=>`<div class="week-event ${e.color}">${escape(e.time)}<br>${escape(e.title)}</div>`).join(''):'<div style="color:#73748c;text-align:center;font-size:10px;margin-top:24px">—</div>'}</button>`}$('#calendarContent').innerHTML=h+'</div>';$('#calendarContent').querySelectorAll('.week-col').forEach(b=>b.onclick=()=>{selected=b.dataset.date;renderAgenda()})}
function renderAgenda(){const d=parse(selected),ev=forDate(selected);$('#selectedLabel').textContent=selected===iso(now)?'СЕГОДНЯ':`${d.getDate()} ${months[d.getMonth()].toLowerCase()}`;$('#agendaTitle').textContent=selected===iso(now)?'План на сегодня':'План на день';$('#agendaSubtitle').textContent=`${fullDays[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()].toLowerCase()}`;$('#eventCount').textContent=`${ev.length} ${ev.length===1?'событие':ev.length<5&&ev.length>1?'события':'событий'}`;$('#agendaList').innerHTML=ev.length?ev.map((e,i)=>`<div class="agenda-item" style="animation-delay:${i*35}ms"><div class="agenda-time">${escape(e.time)}<br><span>${e.duration} мин</span></div><div class="agenda-bar ${e.color}"></div><button class="agenda-open" data-edit="${escape(e.id)}"><div class="agenda-name">${escape(e.title)}</div><div class="agenda-meta">${escape(e.note||'Нажми, чтобы изменить')}</div></button></div>`).join(''):'<div class="empty"><div class="empty-icon">✧</div><strong style="display:block;color:var(--text);margin-bottom:5px">День свободен</strong>Добавь событие и освободи голову от планов.</div>';$('#agendaList').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openModal(events.find(e=>e.id===b.dataset.edit)))}
function openModal(e=null){editing=e?.id??null;$('#eventForm').reset();$('#eventDate').value=e?.date??selected;$('#eventTime').value=e?.time??'10:00';$('#eventName').value=e?.title??'';$('#eventDuration').value=String(e?.duration??60);$('#eventType').value=e?.color??'purple';$('#eventNote').value=e?.note??'';$('#modalTitle').textContent=e?'Редактировать событие':'Новое событие';$('#saveEvent').textContent=e?'Сохранить изменения ↗':'Сохранить событие ↗';$('#deleteEvent').style.display=e?'block':'none';$('#modalBackdrop').classList.add('open');setTimeout(()=>$('#eventName').focus(),70)}
function closeModal(){$('#modalBackdrop').classList.remove('open');editing=null}
function toast(s){const el=$('#toast');el.textContent=s;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2400)}
$('#eventForm').onsubmit=e=>{e.preventDefault();const data={title:$('#eventName').value.trim(),date:$('#eventDate').value,time:$('#eventTime').value,duration:Number($('#eventDuration').value),color:$('#eventType').value,note:$('#eventNote').value.trim()};if(!data.title||!data.date)return;if(editing){events=events.map(x=>x.id===editing?{...x,...data}:x)}else events.push({id:crypto.randomUUID?.()??String(Date.now()),...data});selected=data.date;cursor=new Date(parse(selected).getFullYear(),parse(selected).getMonth(),1);persist();closeModal();render();toast('Событие сохранено на устройстве')};
$('#deleteEvent').onclick=()=>{if(!editing)return;events=events.filter(e=>e.id!==editing);persist();closeModal();render();toast('Событие удалено')};
$('#addTop').onclick=$('#mobileAdd').onclick=()=>openModal();$('#closeModal').onclick=closeModal;$('#modalBackdrop').onclick=e=>{if(e.target===$('#modalBackdrop'))closeModal()};document.onkeydown=e=>{if(e.key==='Escape')closeModal();if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='n'){e.preventDefault();openModal()}};
$('#todayTop').onclick=()=>{selected=iso(now);cursor=new Date(now.getFullYear(),now.getMonth(),1);render()};$('#prev').onclick=()=>{if(view==='month')cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);else{const d=parse(selected);d.setDate(d.getDate()-7);selected=iso(d);cursor=new Date(d.getFullYear(),d.getMonth(),1)}render()};$('#next').onclick=()=>{if(view==='month')cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);else{const d=parse(selected);d.setDate(d.getDate()+7);selected=iso(d);cursor=new Date(d.getFullYear(),d.getMonth(),1)}render()};document.querySelectorAll('.view-btn').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;$('#installBtn').style.display='grid'});$('#installBtn').onclick=async()=>{if(!deferredInstall)return;deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;$('#installBtn').style.display='none'};
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
})();
</script></body></html>
