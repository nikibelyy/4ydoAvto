<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7EBEB">
  <meta name="description" content="Мобильный рабочий календарь с циклическими графиками смен.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <title>Рабочий Календарь</title>
  <style>
    :root{
      --bg:#F7EBEB; --panel:#F8EEE8; --pill:#EAE0E2;
      --work:#3A8E9A; --special:#D33F31; --text:#2D3032;
      --muted:#8A8587; --line:rgba(80,60,65,.08);
      --shadow:0 10px 30px rgba(85,55,60,.10);
      --radius:22px; --cell:44px;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html{height:100%;scroll-behavior:smooth}
    body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      overscroll-behavior-y:none}
    button,input{font:inherit}
    button{border:0;cursor:pointer}
    .app{min-height:100vh;padding-bottom:168px}
    .topbar{position:sticky;top:0;z-index:30;background:rgba(247,235,235,.94);
      backdrop-filter:blur(14px);padding:env(safe-area-inset-top) 12px 8px;
      border-bottom:1px solid var(--line)}
    .topbar-title{display:flex;justify-content:space-between;align-items:center;padding:9px 5px 8px}
    .brand{font-size:18px;font-weight:800;letter-spacing:-.3px}
    .today-btn{padding:8px 13px;border-radius:999px;background:var(--pill);color:var(--text);font-size:13px;font-weight:700}
    .week-head{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
    .week-head div{font-size:11px;font-weight:800;color:var(--muted);padding:6px 0}
    main{width:min(100%,720px);margin:0 auto;padding:8px 10px}
    .month{padding:14px 0 24px}
    .month-title{text-align:center;font-size:24px;font-weight:850;letter-spacing:-.7px;margin:5px 0 14px}
    .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px 3px}
    .day{min-width:0;height:48px;display:flex;align-items:center;justify-content:center;position:relative}
    .day.empty{pointer-events:none}
    .day-number{width:40px;height:40px;display:flex;align-items:center;justify-content:center;
      border-radius:50%;font-size:15px;font-weight:650;transition:transform .16s,background .16s,color .16s,box-shadow .16s}
    .day:not(.empty):active .day-number{transform:scale(.88)}
    .day.work .day-number{background:var(--work);color:white}
    .day.special .day-number{background:var(--special);color:white}
    .day.today .day-number{box-shadow:0 0 0 2px rgba(58,142,154,.28)}
    .day.weekend:not(.work):not(.special) .day-number{color:#777174}
    .day-note{position:absolute;bottom:0px;font-size:8px;color:var(--muted);line-height:1}
    .bottom{position:fixed;z-index:40;left:0;right:0;bottom:0;background:rgba(248,238,232,.96);
      backdrop-filter:blur(18px);border-top:1px solid var(--line);box-shadow:0 -8px 30px rgba(85,55,60,.08);
      padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
    .bottom-inner{width:min(100%,720px);margin:auto}
    .patterns{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
    .pill{background:var(--pill);color:var(--text);border-radius:999px;padding:10px 7px;
      font-size:12px;font-weight:750;white-space:nowrap;transition:transform .16s,background .2s}
    .pill:active{transform:scale(.96)}
    .pill.primary{background:var(--work);color:#fff}
    .stats-toggle{display:flex;justify-content:center;margin:9px 0 7px}
    .toggle{display:flex;background:var(--pill);padding:3px;border-radius:999px}
    .toggle button{background:transparent;border-radius:999px;padding:7px 17px;font-size:12px;font-weight:800;color:var(--muted)}
    .toggle button.active{background:var(--work);color:#fff}
    .stats{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;padding:0 3px}
    .stats span:last-child{text-align:right}
    .legend{display:flex;gap:12px;justify-content:center;margin-top:5px;font-size:10px;color:var(--muted)}
    .legend i{width:9px;height:9px;border-radius:50%;display:inline-block;vertical-align:-1px;margin-right:3px}
    .legend .w{background:var(--work)} .legend .s{background:var(--special)}
    .modal-wrap{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;background:rgba(40,25,28,.28)}
    .modal-wrap.open{display:flex}
    .modal{width:100%;background:#FCF5F1;border-radius:28px 28px 0 0;padding:12px 18px calc(18px + env(safe-area-inset-bottom));
      box-shadow:0 -15px 50px rgba(45,30,35,.18);animation:up .24s ease}
    @keyframes up{from{transform:translateY(20px);opacity:.6}to{transform:none;opacity:1}}
    .handle{width:42px;height:4px;border-radius:4px;background:#D4C7C8;margin:0 auto 14px}
    .modal h2{margin:0 0 4px;font-size:21px}
    .modal p{margin:0 0 14px;color:var(--muted);font-size:13px}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    label{font-size:12px;font-weight:800;color:#71696B}
    input{width:100%;margin-top:5px;border:1px solid #E0D4D5;background:#fff;border-radius:14px;padding:11px 12px;outline:none}
    input:focus{border-color:var(--work);box-shadow:0 0 0 3px rgba(58,142,154,.12)}
    .modal-actions{display:flex;gap:8px;margin-top:15px}
    .modal-actions button{flex:1;padding:12px;border-radius:999px;font-weight:800}
    .cancel{background:var(--pill)} .save{background:var(--work);color:white}
    .toast{position:fixed;z-index:100;left:50%;bottom:185px;transform:translate(-50%,15px);opacity:0;
      background:#303234;color:#fff;padding:10px 15px;border-radius:999px;font-size:12px;font-weight:700;pointer-events:none;transition:.2s}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    @media(min-width:600px){
      :root{--cell:50px}
      .app{padding-bottom:154px}
      .grid{gap:8px 6px}.day{height:54px}.day-number{width:44px;height:44px}
      .bottom{padding-left:20px;padding-right:20px}
    }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-title">
      <div class="brand">Рабочий Календарь</div>
      <button class="today-btn" id="todayBtn">Сегодня</button>
    </div>
    <div class="week-head" aria-hidden="true">
      <div>ПН</div><div>ВТ</div><div>СР</div><div>ЧТ</div><div>ПТ</div><div>СБ</div><div>ВС</div>
    </div>
  </header>

  <main id="calendar" aria-live="polite"></main>
</div>

<section class="bottom" aria-label="Управление графиком">
  <div class="bottom-inner">
    <div class="patterns">
      <button class="pill" data-pattern="1/3">Один/три</button>
      <button class="pill" data-pattern="2/2">Два/два</button>
      <button class="pill" data-pattern="3/3">Три/три</button>
      <button class="pill primary" id="customBtn">＋ Добавить</button>
    </div>
    <div class="stats-toggle">
      <div class="toggle">
        <button id="monthMode" class="active">В месяце</button>
        <button id="yearMode">В году</button>
      </div>
    </div>
    <div class="stats">
      <span id="workStat">Рабочих дней: 0</span>
      <span id="offStat">Выходных дней: 0</span>
    </div>
    <div class="legend"><span><i class="w"></i>рабочий</span><span><i class="s"></i>особый / смена</span></div>
  </div>
</section>

<div class="modal-wrap" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <div class="handle"></div>
    <h2 id="modalTitle">Свой график</h2>
    <p>Укажите количество рабочих и выходных дней, а также дату первого рабочего дня.</p>
    <div class="form-row">
      <label>Рабочих дней
        <input id="workDays" type="number" min="1" max="31" value="4" inputmode="numeric">
      </label>
      <label>Выходных дней
        <input id="offDays" type="number" min="1" max="31" value="2" inputmode="numeric">
      </label>
    </div>
    <label style="display:block;margin-top:10px">Первый рабочий день
      <input id="startDate" type="date">
    </label>
    <div class="modal-actions">
      <button class="cancel" id="cancelBtn">Отмена</button>
      <button class="save" id="saveBtn">Применить</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const KEY = "rabochiy-kalendar-v1";
  const now = new Date();
  const pad = n => String(n).padStart(2,"0");
  const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const parseKey = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
  const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
  const daysBetween = (a,b) => Math.round((b-a)/86400000);
  const monthName = i => ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"][i];

  const defaultState = {
    pattern:{work:2, off:2, start:dateKey(new Date(now.getFullYear(), now.getMonth(), 1))},
    overrides:{},
    mode:"month",
    anchorYear:now.getFullYear(),
    anchorMonth:now.getMonth()
  };
  let state;
  try { state = JSON.parse(localStorage.getItem(KEY)) || defaultState; }
  catch { state = defaultState; }
  state.pattern ||= defaultState.pattern; state.overrides ||= {}; state.mode ||= "month";

  function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
  function patternStatus(d){
    const k=dateKey(d);
    if(state.overrides[k]) return state.overrides[k];
    const start=parseKey(state.pattern.start);
    const n=daysBetween(start,d);
    const cycle=state.pattern.work+state.pattern.off;
    const pos=((n%cycle)+cycle)%cycle;
    return pos < state.pattern.work ? "work" : "off";
  }
  function renderMonths(){
    const root=document.getElementById("calendar"); root.innerHTML="";
    // Render 18 months centered around the selected month for a smooth, long calendar scroll.
    for(let offset=-2; offset<=15; offset++){
      const d=new Date(state.anchorYear,state.anchorMonth+offset,1);
      root.appendChild(renderMonth(d));
    }
    updateStats();
  }
  function renderMonth(first){
    const section=document.createElement("section"); section.className="month";
    const title=document.createElement("h2"); title.className="month-title";
    title.textContent=`${monthName(first.getMonth())} ${first.getFullYear()}`;
    section.appendChild(title);
    const grid=document.createElement("div"); grid.className="grid";
    const firstDay=(first.getDay()+6)%7;
    for(let i=0;i<firstDay;i++){ const e=document.createElement("div"); e.className="day empty"; grid.appendChild(e); }
    const count=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();
    for(let day=1;day<=count;day++){
      const d=new Date(first.getFullYear(),first.getMonth(),day), k=dateKey(d);
      const status=patternStatus(d);
      const cell=document.createElement("button"); cell.className=`day ${status}`;
      if(d.toDateString()===new Date().toDateString()) cell.classList.add("today");
      cell.dataset.date=k; cell.setAttribute("aria-label",`${day} ${monthName(first.getMonth())} ${first.getFullYear()}`);
      cell.innerHTML=`<span class="day-number">${day}</span>${state.overrides[k]==="special"?'<span class="day-note">особый</span>':''}`;
      cell.addEventListener("click",()=>cycleDay(k));
      grid.appendChild(cell);
    }
    section.appendChild(grid); return section;
  }
  function cycleDay(k){
    const current=state.overrides[k] || patternStatus(parseKey(k));
    // Explicit cycle: ordinary -> work -> special -> ordinary.
    // A generated working day becomes ordinary first; an ordinary day becomes work.
    const next=current==="off"?"work":current==="work"?"special":"off";
    state.overrides[k]=next; save(); renderMonths();
    showToast(next==="work"?"Рабочий день":next==="special"?"Особый день / смена":"Выходной");
  }
  function setPattern(w,o,start){
    state.pattern={work:w,off:o,start:start||dateKey(new Date())};
    // Pattern change does not erase manual exceptions.
    save(); renderMonths(); showToast(`График ${w}/${o} применён`);
  }
  function updateStats(){
    let work=0, off=0;
    if(state.mode==="month"){
      const y=state.anchorYear,m=state.anchorMonth, days=new Date(y,m+1,0).getDate();
      for(let i=1;i<=days;i++){ const s=patternStatus(new Date(y,m,i)); s==="work"||s==="special"?work++:off++; }
    }else{
      const y=now.getFullYear();
      for(let m=0;m<12;m++){ const days=new Date(y,m+1,0).getDate(); for(let i=1;i<=days;i++){ const s=patternStatus(new Date(y,m,i)); s==="work"||s==="special"?work++:off++; } }
    }
    document.getElementById("workStat").textContent=`Рабочих дней: ${work}`;
    document.getElementById("offStat").textContent=`Выходных дней: ${off}`;
    document.getElementById("monthMode").classList.toggle("active",state.mode==="month");
    document.getElementById("yearMode").classList.toggle("active",state.mode==="year");
  }
  function openModal(){
    document.getElementById("workDays").value=state.pattern.work;
    document.getElementById("offDays").value=state.pattern.off;
    document.getElementById("startDate").value=state.pattern.start;
    document.getElementById("modal").classList.add("open");
    setTimeout(()=>document.getElementById("workDays").focus(),80);
  }
  function closeModal(){document.getElementById("modal").classList.remove("open")}
  function showToast(t){
    const el=document.getElementById("toast"); el.textContent=t; el.classList.add("show");
    clearTimeout(window.__toast); window.__toast=setTimeout(()=>el.classList.remove("show"),1400);
  }

  document.querySelectorAll("[data-pattern]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const [w,o]=btn.dataset.pattern.split("/").map(Number);
      document.getElementById("workDays").value=w; document.getElementById("offDays").value=o;
      document.getElementById("startDate").value=state.pattern.start || dateKey(new Date());
      openModal();
    });
  });
  document.getElementById("customBtn").addEventListener("click",openModal);
  document.getElementById("cancelBtn").addEventListener("click",closeModal);
  document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
  document.getElementById("saveBtn").addEventListener("click",()=>{
    const w=Math.max(1,Math.min(31,Number(document.getElementById("workDays").value)||1));
    const o=Math.max(1,Math.min(31,Number(document.getElementById("offDays").value)||1));
    const start=document.getElementById("startDate").value || dateKey(new Date());
    setPattern(w,o,start); closeModal();
  });
  document.getElementById("monthMode").addEventListener("click",()=>{state.mode="month";save();updateStats()});
  document.getElementById("yearMode").addEventListener("click",()=>{state.mode="year";save();updateStats()});
  document.getElementById("todayBtn").addEventListener("click",()=>{
    state.anchorYear=now.getFullYear();state.anchorMonth=now.getMonth();save();renderMonths();
    window.scrollTo({top:0,behavior:"smooth"});
  });

  // Swipe between months on touch screens.
  let sx=0,sy=0;
  document.getElementById("calendar").addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  document.getElementById("calendar").addEventListener("touchend",e=>{
    const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)){
      state.anchorMonth += dx<0?1:-1; state.anchorMonth=(state.anchorMonth+12)%12;
      // adjust year using Date to avoid December/January edge cases
      const base=new Date(state.anchorYear,state.anchorMonth,1);
      state.anchorYear=base.getFullYear(); state.anchorMonth=base.getMonth();
      save();renderMonths();
    }
  },{passive:true});

  // Clicking a month title makes that month the statistics target.
  document.getElementById("calendar").addEventListener("click",e=>{
    const title=e.target.closest(".month-title"); if(!title)return;
    const section=title.closest(".month"), months=[...document.querySelectorAll(".month")];
    const idx=months.indexOf(section); if(idx<0)return;
    const d=new Date(state.anchorYear,state.anchorMonth+(idx-2),1);
    state.anchorYear=d.getFullYear();state.anchorMonth=d.getMonth();save();updateStats();
  });

  renderMonths();

  if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
})();
</script>
</body>
</html>
