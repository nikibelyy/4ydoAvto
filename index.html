<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RefMatrix (Local Edition)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs" defer></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between" x-data="app()">

<header class="border-b border-slate-800 bg-slate-950/80 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center font-bold text-white shadow-lg shadow-blue-500/30">R</div>
            <span class="text-xl font-bold tracking-tight">refmatrix</span>
        </div>
        <div>
            <template x-if="loggedIn">
                <button @click="logout()" class="text-sm bg-slate-900 border border-slate-800 px-4 py-2 rounded-xl hover:bg-slate-800 transition">Выйти</button>
            </template>
        </div>
    </div>
</header>

<main class="max-w-7xl mx-auto px-6 py-12 w-full flex-grow flex items-center justify-center">
    
    <!-- Форма входа -->
    <div x-show="!loggedIn" class="w-full max-w-md bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-xl">
        <h2 class="text-2xl font-bold mb-1">Авторизация</h2>
        <p class="text-slate-400 text-sm mb-6">Логин: <code class="text-blue-400">admin</code> | Пароль: <code class="text-blue-400">admin123</code></p>
        
        <form @submit.prevent="login">
            <div class="mb-4">
                <label class="block text-xs text-slate-400 mb-1">Логин</label>
                <input type="text" x-model="loginForm.username" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition">
            </div>
            <div class="mb-6">
                <label class="block text-xs text-slate-400 mb-1">Пароль</label>
                <input type="password" x-model="loginForm.password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition">
            </div>
            <p x-text="loginError" class="text-red-400 text-xs mb-4" x-show="loginError"></p>
            <button type="submit" class="w-full py-3 bg-blue-600 rounded-xl font-semibold hover:bg-blue-500 transition shadow-lg shadow-blue-600/20">Войти</button>
        </form>
    </div>

    <!-- Админ панель -->
    <template x-if="loggedIn && user.isAdmin">
        <div class="w-full space-y-8">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div>
                    <h1 class="text-3xl font-bold">Панель Администратора</h1>
                    <p class="text-slate-400 text-sm mt-1">Управление реферальными ссылками и активациями</p>
                </div>
                <button @click="createLink()" class="bg-blue-600 hover:bg-blue-500 px-5 py-2.5 rounded-xl text-sm font-semibold transition shadow-lg shadow-blue-600/20">+ Создать ссылку</button>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-950 text-slate-400 uppercase text-xs border-b border-slate-800">
                            <tr>
                                <th class="p-4">ID</th>
                                <th class="p-4">Ссылка</th>
                                <th class="p-4">Создатель</th>
                                <th class="p-4">Статус</th>
                                <th class="p-4 text-right">Действие</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-800">
                            <template x-for="link in links" :key="link.id">
                                <tr class="hover:bg-slate-800/40 transition">
                                    <td class="p-4 font-mono text-slate-400" x-text="link.id"></td>
                                    <td class="p-4">
                                        <a :href="`#pay-${link.code}`" @click.prevent="currentPayCode = link.code" class="text-blue-400 hover:underline font-mono" x-text="window.location.origin + '/#pay-' + link.code"></a>
                                    </td>
                                    <td class="p-4" x-text="link.creator"></td>
                                    <td class="p-4">
                                        <span class="px-2.5 py-1 rounded-full text-xs font-medium" :class="link.status === 'paid' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'" x-text="link.status === 'paid' ? 'Оплачено' : 'Ожидает'"></span>
                                    </td>
                                    <td class="p-4 text-right">
                                        <template x-if="link.status !== 'paid'">
                                            <button @click="confirmPayment(link.id)" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded-lg text-xs font-semibold transition">Подтвердить</button>
                                        </template>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </template>

    <!-- Просмотр страницы оплаты по ссылке (если в URL есть #pay-...) -->
    <template x-if="currentPayCode">
        <div class="w-full max-w-md bg-slate-900 border border-slate-800 p-8 rounded-3xl text-center shadow-2xl">
            <h1 class="text-2xl font-bold mb-2">Оплата доступа</h1>
            <p class="text-slate-400 text-sm mb-6">Переведите средства по СБП реквизитам:</p>
            
            <div class="bg-slate-950 p-4 rounded-xl mb-6 text-left border border-slate-800 space-y-2">
                <div>
                    <span class="text-xs text-slate-500 block">Банк получателя:</span>
                    <span class="text-emerald-400 font-semibold" x-text="getLinkCreatorBank(currentPayCode)"></span>
                </div>
                <div>
                    <span class="text-xs text-slate-500 block">Номер телефона СБП:</span>
                    <span class="text-lg font-mono font-bold tracking-wider" x-text="getLinkCreatorPhone(currentPayCode)"></span>
                </div>
            </div>

            <button @click="currentPayCode = null" class="w-full py-3 bg-slate-800 hover:bg-slate-700 rounded-xl font-semibold transition">Назад на главную</button>
        </div>
    </template>

</main>

<footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    &copy; 2026 refmatrix • Local Static Version
</footer>

<script>
function app() {
    return {
        loggedIn: false,
        user: { username: '', isAdmin: false },
        loginForm: { username: '', password: '' },
        loginError: '',
        links: JSON.parse(localStorage.getItem('refmatrix_links')) || [
            { id: 1, code: 'demo123', creator: 'admin', status: 'pending', phone: '+7 (999) 000-00-00', bank: 'Сбербанк' }
        ],
        currentPayCode: null,

        init() {
            // Проверка URL на наличие ссылки оплаты
            if (window.location.hash.startsWith('#pay-')) {
                this.currentPayCode = window.location.hash.replace('#pay-', '');
            }
            window.addEventListener('hashchange', () => {
                if (window.location.hash.startsWith('#pay-')) {
                    this.currentPayCode = window.location.hash.replace('#pay-', '');
                } else {
                    this.currentPayCode = null;
                }
            });

            // Автовосстановление сессии
            const savedUser = localStorage.getItem('refmatrix_user');
            if (savedUser) {
                this.user = JSON.parse(savedUser);
                this.loggedIn = true;
            }
        },

        login() {
            if (this.loginForm.username === 'admin' && this.loginForm.password === 'admin123') {
                this.user = { username: 'admin', isAdmin: true };
                this.loggedIn = true;
                this.loginError = '';
                localStorage.setItem('refmatrix_user', JSON.stringify(this.user));
            } else {
                this.loginError = 'Неверный логин или пароль';
            }
        },

        logout() {
            this.loggedIn = false;
            this.user = {};
            localStorage.removeItem('refmatrix_user');
        },

        createLink() {
            const newCode = Math.random().toString(36).substring(2, 10);
            this.links.unshift({
                id: Date.now(),
                code: newCode,
                creator: this.user.username,
                status: 'pending',
                phone: '+7 (900) 123-45-67',
                bank: 'Тинькофф'
            });
            this.saveLinks();
        },

        confirmPayment(id) {
            if (!confirm('Подтвердить поступление оплаты?')) return;
            const link = this.links.find(l => l.id === id);
            if (link) {
                link.status = 'paid';
                this.saveLinks();
                alert('Оплата подтверждена!');
            }
        },

        saveLinks() {
            localStorage.setItem('refmatrix_links', JSON.stringify(this.links));
        },

        getLinkCreatorPhone(code) {
            const link = this.links.find(l => l.code === code);
            return link ? link.phone : 'Не указан';
        },

        getLinkCreatorBank(code) {
            const link = this.links.find(l => l.code === code);
            return link ? link.bank : 'Не указан';
        }
    }
}
</script>
</body>
</html>
