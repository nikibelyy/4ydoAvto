<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Рабочий календарь</title>

  <!-- Настройки PWA для iOS (Safari) и Android -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="График" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f0f14" />

  <!-- Иконка для главного экрана в стиле ЮMoney -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%238B3FFD'/><circle cx='50' cy='50' r='24' fill='%23ffffff'/><circle cx='50' cy='50' r='10' fill='%238B3FFD'/></svg>" />

  <!-- Шрифт Manrope (современный финтех-стиль) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Подключение Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Manrope', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          colors: {
            yoo: {
              bg: '#0f0f14',
              card: '#1a1a24',
              cardHover: '#22222f',
              purple: '#8B3FFD',
              purpleDark: '#6920D6',
              purpleLight: '#A86BFF',
              green: '#00D97E',
              amber: '#FFB800',
              sky: '#38BDF8'
            }
          }
        }
      }
    }
  </script>

  <!-- Подключение React и Babel для работы прямо в браузере -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      color-scheme: dark;
    }
    body {
      background-color: #09090d;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior-y: none;
      font-family: 'Manrope', sans-serif;
    }
    .pt-safe-top {
      padding-top: env(safe-area-inset-top, 16px);
    }
    .pb-safe-bottom {
      padding-bottom: calc(env(safe-area-inset-bottom, 16px) + 12px);
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .yoo-gradient {
      background: linear-gradient(135deg, #9649FF 0%, #7326E5 55%, #5214B8 100%);
    }
    .yoo-glow {
      box-shadow: 0 12px 32px -8px rgba(139, 63, 253, 0.45);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- Иконки в стиле ЮMoney ---
    const IconCalendar = ({ active }) => (
      <svg className={`w-6 h-6 transition-all duration-300 ${active ? 'text-[#A86BFF] scale-105' : 'text-zinc-500'}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="18" rx="4" ry="4" strokeWidth={active ? "2.2" : "1.8"} />
        <line x1="16" y1="2" x2="16" y2="6" strokeWidth={active ? "2.2" : "1.8"} strokeLinecap="round" />
        <line x1="8" y1="2" x2="8" y2="6" strokeWidth={active ? "2.2" : "1.8"} strokeLinecap="round" />
        <line x1="3" y1="10" x2="21" y2="10" strokeWidth={active ? "2.2" : "1.8"} />
      </svg>
    );

    const IconWallet = ({ active }) => (
      <svg className={`w-6 h-6 transition-all duration-300 ${active ? 'text-[#A86BFF] scale-105' : 'text-zinc-500'}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M19 7V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-1" strokeWidth={active ? "2.2" : "1.8"} strokeLinecap="round" />
        <rect x="15" y="9" width="6" height="6" rx="2" strokeWidth={active ? "2.2" : "1.8"} />
        <circle cx="18" cy="12" r="1" fill="currentColor" />
      </svg>
    );

    const IconSettings = ({ active }) => (
      <svg className={`w-6 h-6 transition-all duration-300 ${active ? 'text-[#A86BFF] scale-105' : 'text-zinc-500'}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" strokeWidth={active ? "2.2" : "1.8"} />
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" strokeWidth={active ? "2.2" : "1.8"} />
      </svg>
    );

    const IconChevronLeft = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M15 19l-7-7 7-7" />
      </svg>
    );

    const IconChevronRight = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M9 5l7 7-7 7" />
      </svg>
    );

    // --- Константы и утилиты ---
    const WEEKDAYS = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
    const MONTHS = [
      'Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь',
      'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'
    ];

    const DEFAULT_SETTINGS = {
      regularRate: 8300,        // Обычная смена (Пн-Пт, Вс) — 8300 ₽
      saturdayRate: 5500,       // Смена в субботу — 5500 ₽
      sundayBonus: 500,         // Доплата за воскресенье — +500 ₽
      sundayMode: 'work',       // 'work' — только рабочее вс (+500 ₽), 'all' — каждое вс
      after16Rate: 550,         // Час после 16:00
      autoHoursAfter16: 0,      // Автоматических часов после 16:00 в каждой смене
      currency: '₽',            // Валюта
      lockSchedule: false,      // Блокировка случайного изменения даты в календаре
      monthsCount: 6            // Сколько месяцев отображать
    };

    const getDaysInMonth = (year, month) => new Date(year, month + 1, 0).getDate();
    const getFirstDayOfMonth = (year, month) => {
      let day = new Date(year, month, 1).getDay();
      return day === 0 ? 6 : day - 1;
    };

    const formatDate = (date) => {
      const d = new Date(date);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };

    const formatMoney = (val) => {
      return Math.round(val).toLocaleString('ru-RU');
    };

    // Проверка рабочего дня по циклу 2/2
    const isWorkDayByCycle = (year, month, day, cycleStartDateStr) => {
      if (!cycleStartDateStr) return false;
      const [sy, sm, sd] = cycleStartDateStr.split('-').map(Number);
      const start = new Date(sy, sm - 1, sd, 0, 0, 0);
      const current = new Date(year, month, day, 0, 0, 0);

      const diffTime = current.getTime() - start.getTime();
      const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

      const cycleLength = 4;
      const dayInCycle = ((diffDays % cycleLength) + cycleLength) % cycleLength;
      return dayInCycle === 0 || dayInCycle === 1;
    };

    // --- Компонент одного месяца в Календаре ---
    const MonthCalendar = ({ year, month, todayStr, cycleStartDateStr, onDayClick, sundayMode }) => {
      const daysInMonth = getDaysInMonth(year, month);
      const firstDay = getFirstDayOfMonth(year, month);

      const blanks = Array.from({ length: firstDay }, (_, i) => i);
      const days = Array.from({ length: daysInMonth }, (_, i) => i + 1);

      return (
        <div className="mb-6 p-5 rounded-3xl bg-yoo-card border border-white/[0.06] shadow-lg">
          <div className="flex items-baseline justify-between mb-4 px-1">
            <h2 className="text-lg font-bold tracking-tight text-white">
              {MONTHS[month]}
            </h2>
            <span className="text-xs font-semibold text-zinc-500">
              {year}
            </span>
          </div>

          <div className="grid grid-cols-7 gap-y-2.5 gap-x-1.5">
            {blanks.map(b => (
              <div key={`blank-${b}`} className="aspect-square" />
            ))}

            {days.map(day => {
              const dateObj = new Date(year, month, day);
              const dateStr = formatDate(dateObj);
              const isToday = dateStr === todayStr;
              const isWork = isWorkDayByCycle(year, month, day, cycleStartDateStr);
              const dayOfWeek = dateObj.getDay();
              const isSaturday = dayOfWeek === 6;
              const isSunday = dayOfWeek === 0;
              const showSundayDot = isSunday && (sundayMode === 'all' || isWork);

              return (
                <div key={day} className="flex justify-center items-center aspect-square">
                  <button
                    onClick={() => onDayClick(dateStr)}
                    className={`
                      w-10 h-10 rounded-2xl flex flex-col items-center justify-center text-sm transition-all duration-200 relative active:scale-90
                      ${isWork && !isToday ? 'bg-[#8B3FFD] text-white font-bold shadow-[0_4px_12px_rgba(139,63,253,0.35)]' : ''}
                      ${!isWork && !isToday ? 'text-zinc-400 hover:bg-white/5 font-medium' : ''}
                      ${isWork && isToday ? 'bg-white text-[#6920D6] font-extrabold ring-2 ring-[#8B3FFD] shadow-[0_0_16px_rgba(139,63,253,0.6)]' : ''}
                      ${!isWork && isToday ? 'bg-white/10 text-white font-bold ring-2 ring-white/40' : ''}
                    `}
                  >
                    <span className="leading-none">{day}</span>

                    {/* Индикатор субботней смены (5500 ₽) */}
                    {isWork && isSaturday && (
                      <span className={`w-1.5 h-1.5 rounded-full absolute bottom-1 ${isToday ? 'bg-[#6920D6]' : 'bg-sky-300'}`} />
                    )}

                    {/* Индикатор воскресной доплаты (+500 ₽) */}
                    {showSundayDot && (
                      <span className="w-1.5 h-1.5 rounded-full bg-[#00D97E] absolute bottom-1 shadow-[0_0_6px_#00D97E]" />
                    )}
                  </button>
                </div>
              );
            })}
          </div>
        </div>
      );
    };

    // --- Основной компонент ---
    function App() {
      const [activeTab, setActiveTab] = useState('calendar');
      const [todayStr] = useState(() => formatDate(new Date()));

      // Дата начала цикла 2/2 (сохраняем совместимость с вашим прошлым ключом)
      const [cycleStartDateStr, setCycleStartDateStr] = useState(() => {
        return localStorage.getItem('depressive_ws_startDate') || todayStr;
      });

      // Настройки с новым ключом v4, чтобы новые ставки 8300 / 5500 / +500 применились сразу
      const [settings, setSettings] = useState(() => {
        try {
          const savedV4 = localStorage.getItem('yoomoney_ws_settings_v4');
          if (savedV4) {
            return { ...DEFAULT_SETTINGS, ...JSON.parse(savedV4) };
          }
          // Переносим только безопасные пользовательские настройки из старой версии, но ставим новые тарифы
          const oldSaved = localStorage.getItem('depressive_ws_settings_v3');
          if (oldSaved) {
            const parsedOld = JSON.parse(oldSaved);
            return {
              ...DEFAULT_SETTINGS,
              lockSchedule: parsedOld.lockSchedule ?? DEFAULT_SETTINGS.lockSchedule,
              monthsCount: parsedOld.monthsCount ?? DEFAULT_SETTINGS.monthsCount,
              after16Rate: parsedOld.after16Rate ?? DEFAULT_SETTINGS.after16Rate,
              autoHoursAfter16: parsedOld.autoHoursAfter16 ?? DEFAULT_SETTINGS.autoHoursAfter16,
              regularRate: 8300,
              saturdayRate: 5500,
              sundayBonus: 500,
              sundayMode: 'work'
            };
          }
          return DEFAULT_SETTINGS;
        } catch {
          return DEFAULT_SETTINGS;
        }
      });

      // Корректировки по месяцам (сохраняем совместимость с прошлым ключом)
      const [adjustments, setAdjustments] = useState(() => {
        try {
          const saved = localStorage.getItem('depressive_ws_adjustments_v2');
          return saved ? JSON.parse(saved) : {};
        } catch {
          return {};
        }
      });

      // Выбранный месяц во вкладке Зарплата
      const [salaryViewDate, setSalaryViewDate] = useState(() => {
        const now = new Date();
        return { year: now.getFullYear(), month: now.getMonth() };
      });

      // Сохранение в localStorage
      useEffect(() => {
        localStorage.setItem('depressive_ws_startDate', cycleStartDateStr);
      }, [cycleStartDateStr]);

      useEffect(() => {
        localStorage.setItem('yoomoney_ws_settings_v4', JSON.stringify(settings));
      }, [settings]);

      useEffect(() => {
        localStorage.setItem('depressive_ws_adjustments_v2', JSON.stringify(adjustments));
      }, [adjustments]);

      const monthsToRender = useMemo(() => {
        const list = [];
        const currentDate = new Date();
        let startYear = currentDate.getFullYear();
        let startMonth = currentDate.getMonth();

        const count = Number(settings.monthsCount) || 6;
        for (let i = 0; i < count; i++) {
          list.push({ year: startYear, month: startMonth });
          startMonth++;
          if (startMonth > 11) {
            startMonth = 0;
            startYear++;
          }
        }
        return list;
      }, [settings.monthsCount]);

      const handleDayClick = (dateStr) => {
        if (settings.lockSchedule) return;
        setCycleStartDateStr(dateStr);
        if (navigator.vibrate) navigator.vibrate(20);
      };

      const updateSetting = (key, value) => {
        setSettings(prev => ({ ...prev, [key]: value }));
      };

      const currentMonthKey = `${salaryViewDate.year}-${String(salaryViewDate.month + 1).padStart(2, '0')}`;
      const currentAdj = adjustments[currentMonthKey] || {
        extraAfter16Hours: 0,
        extraShifts: 0,
        extraSatShifts: 0,
        bonus: 0
      };

      const updateAdjustment = (field, value) => {
        setAdjustments(prev => ({
          ...prev,
          [currentMonthKey]: {
            ...(prev[currentMonthKey] || { extraAfter16Hours: 0, extraShifts: 0, extraSatShifts: 0, bonus: 0 }),
            [field]: value
          }
        }));
      };

      // Информация о сегодняшнем дне для верхнего виджета
      const todayInfo = useMemo(() => {
        const now = new Date();
        const y = now.getFullYear();
        const m = now.getMonth();
        const d = now.getDate();
        const dayOfWeek = now.getDay();
        const isWork = isWorkDayByCycle(y, m, d, cycleStartDateStr);
        const isSat = dayOfWeek === 6;
        const isSun = dayOfWeek === 0;

        const regularRate = Number(settings.regularRate) || 8300;
        const saturdayRate = Number(settings.saturdayRate) || 5500;
        const sundayBonus = Number(settings.sundayBonus) ?? 500;
        const sundayMode = settings.sundayMode || 'work';
        const after16Rate = Number(settings.after16Rate) || 550;
        const autoHours = Number(settings.autoHoursAfter16) || 0;

        let todayPay = 0;
        if (isWork) {
          todayPay += (isSat ? saturdayRate : regularRate) + (autoHours * after16Rate);
        }
        if (isSun && (sundayMode === 'all' || isWork)) {
          todayPay += sundayBonus;
        }

        return { isWork, isSat, isSun, todayPay };
      }, [cycleStartDateStr, settings]);

      // --- Расчет зарплаты для выбранного месяца ---
      const salaryStats = useMemo(() => {
        const { year, month } = salaryViewDate;
        const daysInMonth = getDaysInMonth(year, month);
        const now = new Date();
        const isCurrentMonth = now.getFullYear() === year && now.getMonth() === month;
        const isPastMonth = year < now.getFullYear() || (year === now.getFullYear() && month < now.getMonth());
        const currentDayOfMonth = now.getDate();

        const regularRate = Number(settings.regularRate) || 0;
        const saturdayRate = Number(settings.saturdayRate) || 0;
        const sundayBonus = Number(settings.sundayBonus) || 0;
        const sundayMode = settings.sundayMode || 'work';
        const after16Rate = Number(settings.after16Rate) || 0;
        const autoHoursAfter16 = Number(settings.autoHoursAfter16) || 0;

        let regularShifts = 0;
        let saturdayShifts = 0;
        let sundaysCount = 0;

        let advanceSum = 0;      // 1 - 15 число
        let secondHalfSum = 0;   // 16 - конец месяца
        let earnedSoFar = 0;     // Заработано к текущему дню
        let passedShifts = 0;

        for (let d = 1; d <= daysInMonth; d++) {
          const isWork = isWorkDayByCycle(year, month, d, cycleStartDateStr);
          const dayOfWeek = new Date(year, month, d).getDay();
          const isSat = dayOfWeek === 6;
          const isSun = dayOfWeek === 0;

          let dayPay = 0;

          if (isWork) {
            const shiftBasePay = isSat ? saturdayRate : regularRate;
            const shiftAutoAfter16Pay = autoHoursAfter16 * after16Rate;
            dayPay += shiftBasePay + shiftAutoAfter16Pay;

            if (isSat) saturdayShifts++;
            else regularShifts++;

            if (isPastMonth || (isCurrentMonth && d <= currentDayOfMonth)) {
              passedShifts++;
            }
          }

          // Воскресная доплата +500 ₽ (по умолчанию только в рабочее воскресенье)
          if (isSun && (sundayMode === 'all' || isWork)) {
            sundaysCount++;
            dayPay += sundayBonus;
          }

          if (d <= 15) advanceSum += dayPay;
          else secondHalfSum += dayPay;

          if (isPastMonth || (isCurrentMonth && d <= currentDayOfMonth)) {
            earnedSoFar += dayPay;
          }
        }

        const extraShifts = Number(currentAdj.extraShifts) || 0;
        const extraSatShifts = Number(currentAdj.extraSatShifts) || 0;
        const extraAfter16Hours = Number(currentAdj.extraAfter16Hours) || 0;
        const bonus = Number(currentAdj.bonus) || 0;

        const totalRegularShifts = Math.max(0, regularShifts + extraShifts);
        const totalSaturdayShifts = Math.max(0, saturdayShifts + extraSatShifts);
        const totalShifts = totalRegularShifts + totalSaturdayShifts;
        const restDays = Math.max(0, daysInMonth - totalShifts);

        const totalAfter16Hours = (totalShifts * autoHoursAfter16) + extraAfter16Hours;
        const extraAfter16Pay = extraAfter16Hours * after16Rate;

        const extraShiftsPay = (extraShifts * (regularRate + autoHoursAfter16 * after16Rate)) +
                               (extraSatShifts * (saturdayRate + autoHoursAfter16 * after16Rate));

        const regularShiftsPayTotal = totalRegularShifts * regularRate;
        const saturdayShiftsPayTotal = totalSaturdayShifts * saturdayRate;
        const sundayBonusTotal = sundaysCount * sundayBonus;

        const totalMonthPay = Math.max(0, advanceSum + secondHalfSum + extraShiftsPay + extraAfter16Pay + bonus);
        const paydaySum = Math.max(0, totalMonthPay - advanceSum);

        const earnedWithExtras = (isCurrentMonth || isPastMonth)
          ? Math.max(0, earnedSoFar + extraShiftsPay + extraAfter16Pay + bonus)
          : 0;

        const progressPercent = totalMonthPay > 0
          ? Math.min(100, Math.round((earnedWithExtras / totalMonthPay) * 100))
          : 0;

        return {
          regularShifts: totalRegularShifts,
          saturdayShifts: totalSaturdayShifts,
          sundaysCount,
          sundayBonus,
          sundayBonusTotal,
          regularShiftsPayTotal,
          saturdayShiftsPayTotal,
          totalShifts,
          restDays,
          totalAfter16Hours,
          after16PayTotal: totalAfter16Hours * after16Rate,
          totalMonthPay,
          advanceSum,
          paydaySum,
          earnedWithExtras,
          passedShifts,
          progressPercent,
          regularRate,
          saturdayRate,
          after16Rate,
          bonus
        };
      }, [salaryViewDate, cycleStartDateStr, settings, currentAdj]);

      const changeSalaryMonth = (delta) => {
        setSalaryViewDate(prev => {
          let m = prev.month + delta;
          let y = prev.year;
          if (m < 0) { m = 11; y--; }
          if (m > 11) { m = 0; y++; }
          return { year: y, month: m };
        });
      };

      // --- Вкладка: Календарь ---
      const renderCalendar = () => (
        <div className="px-4 pb-32">
          {/* Верхняя шапка и статус сегодняшнего дня */}
          <div className="sticky top-0 z-20 bg-[#0f0f14]/90 backdrop-blur-xl pt-safe-top pb-3 border-b border-white/[0.06] mb-5">
            <div className="flex items-center justify-between pt-3 pb-3 px-1">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-xl yoo-gradient flex items-center justify-center shadow-md">
                  <span className="text-white font-extrabold text-sm">Ю</span>
                </div>
                <div>
                  <div className="text-sm font-bold text-white leading-tight">Мой график 2/2</div>
                  <div className="text-[11px] text-zinc-400 font-medium">
                    {settings.lockSchedule ? 'Цикл закреплён' : 'Нажмите на день для смены цикла'}
                  </div>
                </div>
              </div>

              <div className={`px-3 py-1.5 rounded-2xl text-xs font-bold flex items-center gap-1.5 ${
                todayInfo.isWork

                  className="flex flex-col items-center py-1.5 gap-1 relative w-24"
                >
                  <IconSettings active={activeTab === 'settings'} />
                  <span className={`text-[11px] transition-colors duration-200 ${activeTab === 'settings' ? 'text-white font-bold' : 'text-zinc-500 font-semibold'}`}>
                    Настройки
                  </span>
                </button>
              </div>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
